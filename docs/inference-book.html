## 后端\r
\r
**任务（task）**\r
一条 \`data/tasks/<id>.json\` 记录，代表一项耗时工作：生成、字幕、合并、加载或卸载模型。前端轮询它看进度。第 04 章。\r
\r
**串行 worker**\r
\`Tasks\` 唯一的后台线程 \`webui-inference\`，按顺序执行队列里的任务。\`normal\` / \`fast\` 推理、字幕、合并、模型加载卸载都在这里。\r
\r
**并发任务**\r
\`submit(concurrent=True)\` 时另开线程执行的任务。目前是所有 \`batch\` 模式的生成，包括外部 API。线程本身不使用模型，只把作业交给批处理线程并等待。\r
\r
**progress 回调**\r
任务系统传给业务函数的唯一参数。调用它会写进度，并在用户请求取消时抛出 \`Cancelled\`。取消因此是协作式的。\r
\r
**ACTIVE**\r
\`queued\` 与 \`running\` 两种状态。活跃任务占用的 session 不能做结构性编辑（返回 409）。\r
\r
**Store / Store.lock**\r
\`data/\` 下 JSON 记录的读写层，以及一把全局可重入锁，用来保护「读-改-写」。第 03 章。\r
\r
**audio 记录**\r
网页上任何可播放、可下载、可作参考音频的文件的元数据。文件可能在 \`data/\` 里，也可能是 \`samples/\` 里的原文件。\r
\r
**samples/**\r
用户自己管理的参考音频库，后端只读。其中文件的 id 由相对路径哈希得出，所以稳定。\r
\r
**角色（role）**\r
一个名字加一个 \`samples/<名字>/\` 文件夹。文件夹里的音频就是这个角色可选的音色。匿名角色可以用任意音频。\r
\r
**绑定（binding）**\r
「台本里的说话人名 → 角色 + 参考音频」的一条映射。预设和 session 各有一组。\r
\r
**session / line / take**\r
台本的三层：session 是一份台本，line 是其中一句，take 是一句话的一次生成结果。第 06 章。\r
\r
**快照（snapshot）**\r
take 生成时的全部输入：文本、说话人、参考音频、推理参数。之后设置变了，take 仍保留其生成条件。\r
\r
**revision / selection_revision**\r
句子的两个版本号，分别在改文本和手动选 take 时加一。生成完成时比较它们，决定新 take 是否成为当前。\r
\r
**Gate**\r
\`engine.py\` 的读写锁。推理持共享锁，加载、卸载、Whisper 持独占锁；写者优先。第 05 章。\r
\r
**Handoff**\r
外部 API 的临时文件交接对象。\`deliver\` 存入路径，\`abandon\` 在请求放弃时删除，保证文件恰好删除一次。\r
\r
## 推理\r
\r
**推理模式（mode）**\r
\`normal\`（普通推理，\`IndexTTS.infer\`）、\`fast\`（批次推理，\`infer_fast\`）、\`batch\`（并发推理，\`Scheduler\`）。对照表见第 02 章。\r
\r
**Mel 频谱（mel spectrogram）**\r
波形经过分帧、FFT、Mel 滤波器组、取对数得到的二维表示，形状 \`[100, T]\`：100 个频带，T 帧。\r
\r
**帧（frame）**\r
Mel 的一列，覆盖约 10.7 毫秒音频。帧移 \`hop_length=256\`，所以每秒 93.75 帧。\r
\r
**cond_mel**\r
参考音频的 Mel 频谱，\`[1, 100, T]\`，音色编码器的输入。\r
\r
**cond_latent**\r
Conformer + Perceiver 的输出，\`[1, 32, 1280]\`，放在 GPT 输入最前面的 32 个音色向量。\r
\r
**声学码（code / mel code）**\r
0 到 8191 的整数，GPT 词表里代表声音的部分。一个码对应 1024 个采样点、42.7 毫秒。\r
\r
**start_mel / stop_mel**\r
id 8192 和 8193。前者是生成起点，后者是停止符，同时用作 \`eos\` 与 \`pad\`。\r
\r
**start_text / stop_text**\r
文本段的边界 token，由 \`prepare_gpt_inputs\` 自动添加。\r
\r
**latent**\r
第二遍前向的输出，\`[1, M, 1280]\`。每个声学码一个连续向量，作为声码器输入。\r
\r
**mel_length_compression**\r
1024。一个声学码对应的采样点数，只用于长度换算。\r
\r
**KV cache**\r
自回归生成时缓存每层历史 token 的 Key/Value，让每步只计算 1 个新 token。批里每一行有独立的 cache。\r
\r
**do_sample**\r
按概率采样还是取最大值。与 \`num_beams\` 一起决定 HF 的生成模式，默认组合是 beam sampling。\r
\r
**beam / best-of-N**\r
beam 是 HF \`generate\` 的搜索宽度，候选之间会交换、剪枝。best-of-N 是 \`batch.py\` 的策略：独立采样 N 条，取平均 log 概率最高的一条，行之间不交换。\r
\r
**分桶（bucket）**\r
\`infer_fast\` 把同一段文本里长度接近的句子分成一组，一组一次生成。\r
\r
**连续批处理（continuous batching）**\r
句子在任意两步之间加入运行中的批，解完即离开。见第 13 章。\r
\r
**Job / _Sentence / _Row**\r
连续批处理的三层单位：一次调用、其中一句、一句的一条解码序列（best-of-N 时一句有 N 行）。\r
\r
**RTF（real-time factor）**\r
总推理时间除以生成音频的时长。小于 1 表示比实时快。\r
`,misconceptions:`读源码或使用网页时容易形成的错误印象，按后端、推理分组。\r
\r
## 后端\r
\r
### 1. 后端在轮询任务队列\r
\r
没有。串行 worker 阻塞在 \`queue.get()\` 上，\`put\` 一次就被唤醒一次。轮询的是浏览器：它每 0.8 秒（空闲时 4 秒）请求一次 \`/api/tasks\`。\r
\r
### 2. 取消会立即停止推理\r
\r
取消只设置一个标志。任务下一次调用 \`progress\` 时才看到它并抛出 \`Cancelled\`。正在解码的句子会先解完。\r
\r
### 3. 合并不用模型，所以不用排队\r
\r
合并是串行任务，会排在 \`normal\` / \`fast\` 的生成任务之后。它只是不持有模型的锁。\r
\r
### 4. 台本选「批次推理」（fast）会快很多\r
\r
\`fast\` 只在一次调用内部分桶。台本每句是独立调用，短句只切出一个句子，没有东西可以分桶。要让整篇台本变快，用「并发推理」（batch）。\r
\r
### 5. 外部 API 会按配置里的模式推理\r
\r
外部 API 总是走连续批处理，不进串行队列。所以网页上的 API 设置不提供模式选择，\`num_beams\` 在那里表示 best-of-N。\r
\r
### 6. audio.register 会复制音频文件\r
\r
它只写一条 JSON 元数据记录，文件留在原路径。\r
\r
### 7. deliver 负责发送 HTTP 响应\r
\r
\`deliver\` 只把临时文件路径交给 \`Handoff\`。响应由路由的 \`FileResponse\` 发送，发完由 \`BackgroundTask\` 删除。\r
\r
### 8. 生成台本时不能编辑 session\r
\r
可以改单句的文本、切换当前 take。版本号保证新 take 不会覆盖用户的选择。不能做的是改变句子结构的操作：重排、替换台本、删除句子、清理 take，它们会返回 409。\r
\r
### 9. Whisper 和 TTS 可以同时在显存里\r
\r
字幕任务持独占锁，会先卸载 TTS 再加载 Whisper。下一次 TTS 推理会自动重新加载。\r
\r
## 推理\r
\r
### 10. 推理需要 dvae.pth\r
\r
不需要。声学码由 GPT 直接生成，DVAE 只用于把训练音频编码成码。\r
\r
### 11. 同一批的句子会互相影响\r
\r
Transformer 的 batch 维是独立的。每行有自己的提示、KV cache 和注意力掩码，第 1 句的码不会进入第 2 句的上下文。这对 \`fast\` 的桶和 \`batch\` 的行都成立。\r
\r
### 12. 分桶会改变句子内容或顺序\r
\r
分桶只改变生成顺序。每句的文本、音色和采样参数都不变，生成后按原始下标重排。\r
\r
### 13. 分桶后句子被拼成一条长序列\r
\r
批内是多条独立序列并排计算，长度不同时用左填充对齐，mask 屏蔽填充位。\r
\r
### 14. SentencePiece 等于中文分词\r
\r
它做子词切分，不输出词边界。中文预处理后基本按字切，英文按 BPE 切。\r
\r
### 15. mel_length_compression 参与 Mel 提取\r
\r
Mel 提取只看 \`hop_length=256\`。1024 只用于把码数换算成采样点数。BigVGAN 的上采样乘积也是 1024，两者数值一致，但代码各管各的。\r
\r
### 16. do_sample=True 时就没有 beam search 了\r
\r
默认 \`do_sample=True\` 且 \`num_beams=3\`，transformers 用的是 beam sampling：每条 beam 内部采样，再按总分保留。纯 beam search 需要 \`do_sample=False\`。\r
