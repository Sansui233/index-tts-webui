\r
- 一次生成请求的执行顺序、所在线程与结果的存放位置；\r
- 后端的设计取舍：任务队列、读写锁、JSON 存储、take 快照各自解决的问题；\r

## 预设的读者\r
\r
本书假定读者熟悉 Python，了解线程、锁与 FastAPI 路由，对 Transformer 有基本认识。机器学习概念（Mel 频谱、KV cache、beam search 等）在首次出现时给出简要说明，不展开推导。\r
\r

\r

| 推理 | 07–13 | 模型各阶段的计算与三种模式的实现差异 |\r
\r
「全局」部分讲整体结构和一次请求的流程，建议先读。其余部分可按需选读：\r
\r
- 修改后端功能：阅读 03–06，推理部分仅需第 07 章的总览。\r
- 理解模型：阅读 02 了解请求进入模型的过程，再阅读 07–13。\r

\r
正文里的 \`backend/tasks.py:61\` 表示文件与行号，对应写作时的仓库状态。代码片段只保留与讨论相关的行，省略处用 \`...\` 标出。\r

仓库的顶层目录：\r
\r
\`\`\`\r
backend/     FastAPI 服务：路由、任务、存储、引擎适配\r
frontend/    React 网页，构建产物放在 frontend/dist\r
indextts/    推理代码：IndexTTS 模型与连续批处理调度器\r
checkpoints/ 模型权重与 config.yaml，Whisper 模型在 checkpoints/whisper/\r
samples/     参考音频库，只读，按角色名分文件夹\r

## 常用术语\r
\r
**任务（task）**：后端里所有耗时的操作（生成、字幕、合并、加载模型）都被包装成一条任务记录，前端通过轮询获取进度。第 04 章。\r
\r
**推理模式（mode）**：\`normal\`（普通推理）、\`fast\`（批次推理）、\`batch\`（并发推理）。它决定推理路径与执行线程。第 02 章有完整的对照表。\r
\r
**take**：台本里某一句的一次生成结果。同一句可以生成多次，每次都是一个 take，用户挑一个作为当前版本。第 06 章。\r
`,map:'这一章介绍系统的整体结构：进程与线程、服务对象、状态存放位置，以及异常到 HTTP 状态码的映射。细节在后续章节展开。\r\n\r\n## 进程与对外接口\r\n\r\n`uv run main.py` 启动一个 uvicorn 进程（`main.py`，`workers=1`），监听 7863 端口，对外提供：\r\n\r\n| 路径 | 给谁用 | 定义 |\r\n|---|---|---|\r\n| `/api/...` | 网页前端 | `backend/routes.py:24` `build_router` |\r\n| `/tts/<slug>` | 听书软件等外部程序 | `backend/routes.py:355` `build_tts_router` |\r\n| `/` | 浏览器打开的网页 | `frontend/dist` 静态文件（`app.py:66`） |\r\n\r\n开发时前端单独运行在 5173 端口（`pnpm --dir frontend dev`），Vite 把 `/api` 和 `/tts` 代理到 7863。\r\n\r\n只有一个进程是刻意的：模型权重在显存里只能放一份，多进程就要多份权重，8 GB 显卡放不下。所以 `workers=1` 不能改大，并发靠进程内的线程完成。\r\n\r\n## 进程里的线程\r\n\r\n| 线程 | 创建位置 | 职责 |\r\n|---|---|---|\r\n| uvicorn 事件循环 + 线程池 | uvicorn | 处理 HTTP。FastAPI 把同步的 `def` 路由放进线程池执行 |\r\n| `webui-inference` | `tasks.py:45`，启动时 | 唯一的串行 worker，按顺序执行排队的任务 |\r\n| `webui-batch` | `engine.py:183`，第一次并发推理时 | 连续批处理调度器，所有 `batch` 模式的解码都在这里 |\r\n| 并发任务线程 | `tasks.py:84`，每个并发任务一个 | 把工作交给 `webui-batch`，然后等结果、写文件 |\r\n\r\nHTTP 线程不执行推理。路由函数只做校验、创建任务记录，然后立即返回。推理在 `webui-inference` 和 `webui-batch` 上执行；并发任务线程只负责交付作业和等待结果。\r\n\r\n## 服务对象的组装\r\n\r\n启动时 `backend/app.py:18` 的 `services()` 按依赖顺序创建所有服务对象：\r\n\r\n```python\r\n# backend/app.py:18\r\ndef services(data, engine):\r\n    store = Store(data)\r\n    tasks = Tasks(store)\r\n    audio = Audio(store, tasks)\r\n    library = Library(store, audio)\r\n    sessions = Sessions(store, tasks, audio, library)\r\n    generation = Generation(store, tasks, audio, sessions, engine)\r\n    apis = Apis(store, audio, tasks, generation)\r\n    return SimpleNamespace(store=store, tasks=tasks, ...)\r\n```\r\n\r\n每个对象只通过构造参数获得所依赖的对象。这个 `SimpleNamespace` 再传给 `build_router(state)`，路由函数通过闭包引用这些实例。没有全局单例，也没有依赖注入框架；测试时向 `create_app` 传入替身 `engine`，即可测试全部接口。\r\n\r\n| 对象 | 文件 | 一句话职责 |\r\n|---|---|---|\r\n| `Store` | `storage.py:33` | 把 JSON 记录读写到 `data/`，提供一把全局锁 |\r\n| `Tasks` | `tasks.py:23` | 任务记录、串行队列、进度与取消 |\r\n| `Audio` | `audio.py:25` | 音频记录：上传、`samples/` 引用、路径解析 |\r\n| `Library` | `library.py:8` | 角色与多人对话预设 |\r\n| `Sessions` | `sessions.py:33` | 项目、session、句子、take |\r\n| `Generation` | `generation.py:15` | 把「生成」类请求变成任务，选择推理路径 |\r\n| `Apis` | `apis.py:51` | 外部 TTS 接口 `/tts/<slug>` |\r\n| `Engine` | `engine.py:91` | 懒加载模型、读写锁、两套推理入口、Whisper |\r\n\r\n`Engine` 是唯一不读 `Store` 的对象，它的状态全在内存里：模型是否加载、调度器、等待的批处理作业。\r\n\r\n```fig-classes\r\n```\r\n\r\n## 持久状态\r\n\r\n所有持久状态都在 `data/` 下（可用环境变量 `WEBUI3_DATA` 改位置，`config.py:6`）。每条记录是一个 JSON 文件：\r\n\r\n```\r\ndata/\r\n  tasks/<id>.json       任务记录（30 天后自动清理）\r\n  audio/<id>.json       音频记录：名称、相对路径、大小\r\n  audio/files/          上传的参考音频\r\n  outputs/              单句生成的音频\r\n  roles/  presets/      角色、多人对话预设\r\n  projects/  sessions/  项目、session 记录\r\n  sessions/<id>/takes/  每句的 take 音频\r\n  sessions/<id>/merged/ 合并后的整篇音频\r\n  apis/<id>.json        外部 API 配置\r\n```\r\n\r\n`samples/` 在 `data/` 之外，是用户自己管理的参考音频库。后端只读它，从不往里写：引用 `samples/` 的文件时只建一条 `audio` 记录指向原文件（第 03 章）。\r\n\r\n选择 JSON 文件而不是数据库，是因为数据量小，并且用户可以直接打开、备份、手改。代价是没有事务和索引，`Store` 用一把全局锁弥补（第 03 章）。\r\n\r\n## 异常与状态码\r\n\r\n服务层不认识 HTTP，它们只抛 Python 异常。`app.py:51-62` 统一把异常翻译成状态码：\r\n\r\n| 异常 | 状态码 | 典型来源 |\r\n|---|---|---|\r\n| `ValueError` | 400 | 参数不合法、文件缺失 |\r\n| `Busy`（`ValueError` 的子类） | 409 | 编辑有活跃任务的 session |\r\n| `KeyError` | 404 | 记录不存在 |\r\n| `Denied` | 自带 | 外部 API 的 401 / 404 / 405 |\r\n\r\n所以读服务层代码时，看到 `raise ValueError("...")` 就知道前端会收到一个带这条中文提示的 400。\r\n\r\n## 本章对应文件\r\n\r\n- `main.py` — 启动参数\r\n- `backend/app.py:18`、`:38` — 对象组装、异常映射、静态文件\r\n- `backend/config.py` — `ROOT`、`DATA`\r\n- `frontend/vite.config.ts` — 开发代理\r\n',request:'这一章跟踪一次单句生成请求：从浏览器发出 `POST /api/speech`，到 WAV 写入磁盘，再到前端获得结果。每个对象只介绍它在这条路线上做的事，细节在后续章节。最后列出 `normal`、`fast`、`batch` 在各功能中的执行路径。\r\n\r\n## 概览\r\n\r\n```\r\n浏览器                       HTTP 线程          串行 worker / 并发线程         模型\r\n  │ POST /api/speech            │                       │                       │\r\n  │────────────────────────────►│ 校验，建任务记录       │                       │\r\n  │◄──── 202 + task ────────────│ 立即返回              │                       │\r\n  │                             │                       │ run(progress)         │\r\n  │ GET /api/tasks（每 0.8 秒）  │                       │──────────────────────►│ 推理\r\n  │◄──── progress: 0.4 ─────────│                       │◄──── 写 WAV ──────────│\r\n  │ GET /api/tasks              │                       │ 登记音频，任务成功     │\r\n  │◄──── succeeded + result ────│                       │                       │\r\n```\r\n\r\n1. **请求不等推理。** `/api/speech` 返回 202 和一条任务记录，音频此时还没开始生成。\r\n2. **推理不在 HTTP 线程上。** 它在串行 worker 或并发线程里执行。\r\n3. **进度靠轮询。** 前端反复读任务记录，没有 websocket。\r\n\r\n## 第 1 步：路由只转交\r\n\r\n```python\r\n# backend/routes.py:87\r\n@api.post("/speech", status_code=202)\r\ndef speech(request: S.Speech):\r\n    return generation.speech(request)\r\n```\r\n\r\nFastAPI 先用 Pydantic 模型 `S.Speech` 校验请求体（`schemas.py:72`）：`text`、`audio_id`，以及一个 `generation` 对象，里面是推理模式和采样参数。字段越界、多出未知字段都会直接返回 422，不会进入服务层。\r\n\r\n这也是整个 `routes.py` 的风格：路由函数一两行，规则全在服务对象里（文件开头的注释写着 "Handlers only translate requests; services hold the rules"）。\r\n\r\n## 第 2 步：Generation 选路径、封闭包\r\n\r\n```python\r\n# backend/generation.py:29\r\ndef speak(self, audio_id, text, settings, kind="speech", label="", deliver=None, batched=False):\r\n    source = self.audio.path(audio_id)\r\n    batched = batched or is_batch(settings)\r\n    infer = self.engine.synthesize if batched else self.engine.infer\r\n\r\n    def run(progress):\r\n        path = self.audio.new_path(".wav", "outputs")\r\n        try:\r\n            infer(source, text, path, settings, progress)\r\n            return self.audio.register(path, title(text))\r\n        except Exception:\r\n            path.unlink(missing_ok=True)\r\n            raise\r\n\r\n    return self.tasks.submit(kind, run, audio_ids=[audio_id], title=..., concurrent=batched)\r\n```\r\n\r\n（省略了外部 API 用的 `deliver` 分支，第 06 章再讲。）\r\n\r\n`speak` 本身几乎不花时间，它做的事：\r\n\r\n- 把 `audio_id` 解析成磁盘路径 `source`。文件不存在会立刻抛 `ValueError`，用户马上得到 400，而不是排队半天后失败。\r\n- 根据 `settings["mode"]` 选推理函数：`batch` 模式用 `Engine.synthesize`，其余用 `Engine.infer`。\r\n- 把剩下的工作封成闭包 `run(progress)` 交给任务系统。闭包捕获了 `source`、`text`、`settings`，执行时只需要一个 `progress` 回调。\r\n\r\n把工作写成「接收 `progress` 的闭包」是整个后端的统一形状。生成、字幕、合并、加载模型都是这样交给 `Tasks.submit` 的，任务系统因此不需要知道任何业务细节。\r\n\r\n## 第 3 步：Tasks 创建记录并选择执行方式\r\n\r\n```python\r\n# backend/tasks.py:61\r\ndef submit(self, kind, function, session_ids=(), audio_ids=(), title="", line_ids=(), concurrent=False):\r\n    with self.store.lock:\r\n        task = self.store.create("tasks", {"kind": kind, "status": "queued", "progress": 0, ...})\r\n        if concurrent:\r\n            Thread(target=self._execute, args=(task["id"], function), daemon=True).start()\r\n        else:\r\n            self.queue.put((task["id"], function))\r\n        return task\r\n```\r\n\r\n任务记录写进 `data/tasks/<id>.json`，状态是 `queued`。然后分两路：\r\n\r\n- **串行**（`normal`、`fast`）：放进 `queue.Queue`，由唯一的 worker 线程按顺序取出执行。\r\n- **并发**（`batch`）：当场开一个线程执行。这个线程会把工作交给 `Engine` 的批处理线程，自己只是等。\r\n\r\n`submit` 返回的记录一路回到路由，作为 202 响应体发给浏览器。\r\n\r\n## 第 4 步：执行并汇报进度\r\n\r\nworker 线程取到任务后调用 `_execute`（`tasks.py:152`）：\r\n\r\n```python\r\ntask.update(status="running", started_at=now())\r\nresult = function(lambda value=None, desc="": self.progress(key, value, desc))\r\nself.progress(key, 1, "完成")\r\nself._finish(key, "succeeded", result=result)\r\n```\r\n\r\n`function` 就是第 2 步的 `run`。传进去的 `progress` 每被调用一次，就把进度写回任务 JSON，并检查用户是否请求了取消；如果请求了，它抛出 `Cancelled`，推理就停在当前句子的边界上。第 04 章细讲。\r\n\r\n`run` 调用 `Engine.infer`（`engine.py:150`），它先确保模型已加载（第一次调用时才加载），获取读写锁的共享锁，再调用 `IndexTTS.infer`。模型内部的计算见「推理」部分；对后端而言，这一步的结果是 `path` 处生成了一个 WAV 文件。\r\n\r\n`run` 随后调用 `audio.register(path)` 写一条 `audio` 记录，并把它作为返回值。`_execute` 把它存进任务的 `result` 字段，状态改成 `succeeded`。\r\n\r\n## 第 5 步：前端看到结果\r\n\r\n前端的轮询在 `frontend/src/state.tsx:121`：\r\n\r\n```ts\r\nconst [t, m] = await Promise.all([api.get("/tasks"), api.get("/models")]);\r\n...\r\ntimer = setTimeout(poll, active ? 800 : 4000);\r\n```\r\n\r\n有活跃任务或模型正在加载时，每 0.8 秒请求一次 `/api/tasks`；空闲时每 4 秒一次。提交任务时 `track()` 会立即触发一次轮询，因此新任务会立即出现在列表中。\r\n\r\n任务变成 `succeeded` 后，`result` 里就是音频记录，网页用 `/api/audio/<id>/file` 播放它。\r\n\r\n```fig-pipeline\r\n```\r\n\r\n## 轮询与 websocket 的取舍\r\n\r\n原因：\r\n\r\n- **任务记录本来就在磁盘上。** 进度每次变化都要写 JSON（服务重启后能看到中断的任务），轮询直接读这份记录，不需要第二套推送机制。\r\n- **断线自愈。** 后端重启、网络抖动后，下一次轮询自然恢复，前端没有重连逻辑。\r\n- **成本低。** `/api/tasks` 最多返回 100 条记录（`routes.py:69`），读的是本地 JSON 文件。\r\n\r\n推送能做到的「更实时」在这里没有意义：一句话生成要好几秒，进度条晚 0.8 秒刷新没人察觉。\r\n\r\n## normal / fast / batch 的执行路径\r\n\r\n上面走的是 `normal` 模式。`mode` 字段在不同功能里决定的东西不一样：\r\n\r\n| 功能 | `normal` 普通推理 | `fast` 批次推理 | `batch` 并发推理 |\r\n|---|---|---|---|\r\n| 单句生成 `/api/speech` | 串行 worker → `IndexTTS.infer` | 串行 worker → `IndexTTS.infer_fast` | 并发线程 → `Scheduler` |\r\n| 台本生成（整篇或单句） | 串行 worker，逐句 `infer` | 串行 worker，逐句 `infer_fast` | 并发线程，所有句子一次交给 `Scheduler` |\r\n| 外部 API `/tts/<slug>` | — | — | 总是走这里，不看 `mode` |\r\n\r\n不受 `mode` 影响的任务：\r\n\r\n| 功能 | 执行位置 | 锁 |\r\n|---|---|---|\r\n| 加载 / 卸载模型 | 串行 worker | 独占 |\r\n| 字幕（Whisper） | 串行 worker | 独占，会先卸载 TTS |\r\n| 合并整篇音频 | 串行 worker | 不使用模型 |\r\n\r\n几个直接推论：\r\n\r\n- `normal` 与 `fast` 的任务彼此排队，同一时刻只执行一个。`batch` 任务不排队，多个请求的句子在同一批里一起解码。\r\n- `fast` 的加速来自「一段文本内部」的分桶：长文本被切成多句，长度相近的句子一起生成。台本每句是一次独立调用，短句通常只有一个句子，所以 `fast` 在台本里和 `normal` 差别不大。要让整篇台本变快，用 `batch`。\r\n- 合并音频在串行队列里，会排在 `normal` 模式的长台本后面，即使它不需要模型。\r\n- 外部 API 的网页设置里没有模式选择，因为它固定使用 `batch`。\r\n\r\n## batch 模式的不同之处\r\n\r\n把 `mode` 换成 `batch`，第 3 步之后的路线变成：\r\n\r\n```\r\nTasks.submit(concurrent=True)\r\n  └─ 新线程 → _execute → run(progress)\r\n       └─ Engine.synthesize → synthesize_many\r\n            ├─ 把 (参考音频, 文本, 设置) 包成 Job，放进 Engine.pending\r\n            ├─ 唤醒 webui-batch 线程\r\n            └─ 每 0.5 秒检查 Job 是否完成、汇报进度\r\n                                    │\r\n        webui-batch 线程：Engine._serve\r\n            └─ Scheduler.submit(job) → 循环 Scheduler.step()\r\n```\r\n\r\n并发线程不使用模型，只负责提交作业并等待结果。解码集中在 `webui-batch` 一个线程里，这样多个请求才能合并到同一批张量里计算（第 13 章）。\r\n\r\n```fig-calls\r\n```\r\n\r\n## 本章对应文件\r\n\r\n- `backend/routes.py:87` — 单句生成接口\r\n- `backend/schemas.py:29`、`:72` — `Generation`、`Speech`\r\n- `backend/generation.py:29` — 选路径、封闭包\r\n- `backend/tasks.py:61`、`:152` — 建任务、执行\r\n- `backend/engine.py:150`、`:171` — 两种推理入口\r\n- `frontend/src/state.tsx:121` — 轮询\r\n',storage:'后端所有持久状态都是 `data/` 下的 JSON 文件，外加一个只读的 `samples/` 目录。本章介绍 `Store` 的记录读写，音频记录对上传文件、`samples/` 文件与生成文件的统一表示，以及角色与预设对音频的引用。\r\n\r\n## Store：记录就是文件\r\n\r\n`Store`（`storage.py:33`）把「类型 + id」映射成文件路径：\r\n\r\n```python\r\n# backend/storage.py:48\r\ndef record_path(self, kind, key):\r\n    if kind not in KINDS:\r\n        raise ValueError("未知资源类型")\r\n    if not re.fullmatch(r"[a-zA-Z0-9_-]+", key):\r\n        raise ValueError("无效资源 ID")\r\n    return self.path(f"{kind}/{key}.json")\r\n```\r\n\r\n`KINDS` 是固定的七种：`roles`、`presets`、`projects`、`sessions`、`audio`、`tasks`、`apis`（`storage.py:11`）。id 只允许字母数字和 `-_`，`path()` 还会检查解析后的路径位于 `data/` 之内。这两道检查让 URL 里的 id 不可能变成 `../../something`。\r\n\r\n记录的读写方法是 `get`、`list`、`create`、`update`、`save`、`delete`。`create` 自动补 `id`、`created_at`、`updated_at` 和 `schema_version`。\r\n\r\n### 原子写\r\n\r\n```python\r\n# backend/storage.py:72\r\ndef write_json(self, path, data):\r\n    temporary = path.with_name(path.name + f".{uid()}.tmp")\r\n    try:\r\n        temporary.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")\r\n        replace(temporary, path)\r\n    finally:\r\n        temporary.unlink(missing_ok=True)\r\n```\r\n\r\n先写临时文件，再用 `os.replace` 原子替换。进程在写到一半时崩溃，旧文件仍然完整，不会留下半个 JSON。`replace` 在 Windows 上会重试几次（`storage.py:22`），因为杀毒软件和索引服务会短暂锁住新文件。\r\n\r\n### 一把全局锁\r\n\r\nJSON 文件没有事务。「读出 session、改一句话、写回去」如果被两个线程交错执行，后写的会覆盖先写的。`Store.lock` 是一把全局 `RLock`，调用方在整个「读-改-写」期间持有它：\r\n\r\n```python\r\n# backend/storage.py:105\r\ndef update(self, kind, key, fields):\r\n    with self.lock:\r\n        record = self.get(kind, key)\r\n        record.update(fields)\r\n        return self.save(kind, record)\r\n```\r\n\r\n可重入锁（`RLock`）让服务方法可以在持锁时调用其他也会加锁的方法，比如 `Sessions.edit` 持锁后调用 `store.get` 和 `store.save`。\r\n\r\n所有记录共用一把锁。锁内只有 JSON 文件的读写，推理这类耗时操作从不在锁内进行。\r\n\r\n## Audio：三种来源，一种记录\r\n\r\n网页上能播放、下载、选作参考音频的每个文件，都有一条 `audio` 记录：\r\n\r\n```json\r\n{ "id": "...", "name": "旁白 01", "path": "outputs/3f2a....wav", "size": 482204 }\r\n```\r\n\r\n文件有三种来源，记录的形状相同，`path` 的含义不同：\r\n\r\n| 来源 | `path` 相对于 | 产生方式 | id |\r\n|---|---|---|---|\r\n| 上传 | `data/`，在 `audio/files/` 下 | `Audio.upload` | 随机 |\r\n| `samples/` 引用 | `samples/`，带 `"source": "samples"` | `Audio.sample` | 由路径哈希得出 |\r\n| 生成结果 | `data/`，在 `outputs/` 或 `sessions/<id>/merged/` 下 | `Audio.register` | 随机 |\r\n\r\n`Audio.file`（`audio.py:91`）根据 `source` 选择解析目录：\r\n\r\n```python\r\ndef file(self, record):\r\n    if record.get("source") != "samples":\r\n        return self.store.path(record["path"])\r\n    path = (SAMPLES / record["path"]).resolve()\r\n    ...\r\n```\r\n\r\n推理代码只关心 `audio.path(id)` 返回的绝对路径，不需要知道文件从哪来。\r\n\r\n### samples 只读、原地引用\r\n\r\n`samples/` 是用户自己整理的参考音频库，后端从不写入或复制。`Audio.sample`（`audio.py:118`）第一次见到某个文件时建一条记录指向它：\r\n\r\n```python\r\nkey = sample_id(relative)   # "sample-" + sha1(相对路径)[:24]\r\n```\r\n\r\nid 由相对路径算出，所以同一个文件不管被扫描多少次，id 都相同。角色、预设、take 里保存的 `audio_id` 因此在服务重启、重新扫描之后仍然有效。\r\n\r\n### 上传去重\r\n\r\n`Audio.upload`（`audio.py:54`）流式写入新文件，然后用 `same_as` 比较：如果已有内容完全相同的上传，或 `samples/` 里有相同文件，就删掉刚写的文件，返回已有的记录。先比大小，大小相同再逐字节比较，所以代价很小。\r\n\r\n### register 只登记\r\n\r\n`register`（`audio.py:35`）检查文件存在、扩展名合法、位于 `data/` 内，然后写一条记录。它不移动、不复制文件。生成代码的顺序因此总是「先在 `data/` 里分配路径并写文件，再登记」。\r\n\r\n### 受保护的音频\r\n\r\n`Audio.referenced`（`audio.py:147`）收集仍被使用的 id：预设和 session 的说话人绑定、所有 take 快照里的参考音频、正在运行的任务的输入。删除 session 之前会先查这个集合（`sessions.py:129`），防止删掉别处还在引用的文件。\r\n\r\n## Library：角色与预设\r\n\r\n**角色**（`roles/<id>.json`）只有名称、标签和 `anonymous` 标志。它的参考音频不存在记录里，而是 `samples/<角色名>/` 文件夹里当前的所有音频（`library.py:18`）。这样用户在文件管理器里往文件夹加一段录音，角色就多了一个可选音色，不需要在网页上操作。\r\n\r\n匿名角色（旁白、路人）不对应文件夹，可以绑定任意音频。\r\n\r\n**多人对话预设**（`presets/<id>.json`）是一组「说话人 → 角色 + 参考音频」的绑定，加一份推理参数：\r\n\r\n```python\r\n# backend/schemas.py:23\r\nclass Binding(Input):\r\n    speaker: str                 # 台本里写的名字，如「小明」\r\n    role_id: str | None = None\r\n    audio_id: str | None = None  # 选中的参考音频\r\n```\r\n\r\n`validate_bindings`（`library.py:22`）保证同一预设里说话人不重名，非匿名角色只能绑定自己文件夹里的音频。\r\n\r\n### 改名时的迁移\r\n\r\n角色改名意味着文件夹改名，文件夹里每个文件的 `samples` id 都会变（id 来自路径）。`PUT /api/roles/{key}`（`routes.py:146`）因此先算出「旧 id → 新 id」的映射，再调用 `Sessions.rebind` 把所有 session 绑定、预设绑定、take 快照、外部 API 音色一次性改过去。这是 id 绑定路径换来的代价：id 稳定，但路径变化时要显式迁移。\r\n\r\n## 本章对应文件\r\n\r\n- `backend/storage.py:33` — `Store`\r\n- `backend/storage.py:72` — 原子写\r\n- `backend/audio.py:25` — `Audio`\r\n- `backend/audio.py:91`、`:118` — 两种来源的路径解析、`samples` 引用\r\n- `backend/audio.py:147` — 引用检查\r\n- `backend/library.py:8` — 角色与预设\r\n- `backend/sessions.py:89` — 改名后的 `rebind`\r\n',tasks:'后端所有耗时操作都通过任务系统执行，前端通过它查看进度、取消任务、获取结果。代码在 `backend/tasks.py`。\r\n\r\n## 任务记录\r\n\r\n一条任务就是 `data/tasks/<id>.json`：\r\n\r\n```json\r\n{\r\n  "id": "...", "kind": "speech", "title": "你好，世界",\r\n  "status": "running", "progress": 0.4, "message": "gpt inference speech... 2/5",\r\n  "session_ids": [], "audio_ids": ["..."], "line_ids": [],\r\n  "result": null, "error": null, "cancel_requested": false,\r\n  "created_at": "...", "started_at": "...", "finished_at": null\r\n}\r\n```\r\n\r\n| 字段 | 用途 |\r\n|---|---|\r\n| `kind` | `speech`、`subtitles`、`session-generate`、`merge`、`model-load`、`model-unload` |\r\n| `status` | 见下面的状态图 |\r\n| `progress` / `message` | 0–1 的进度和一行说明，由 `progress()` 写入 |\r\n| `session_ids` / `audio_ids` / `line_ids` | 任务占用的资源，用于加锁和防误删 |\r\n| `result` | 成功时的返回值，通常是一条 `audio` 记录 |\r\n\r\n记录写在磁盘上，而不是只放在内存里，有两个原因：前端轮询直接读它；服务重启后仍可查看被中断的任务。\r\n\r\n### 状态\r\n\r\n```\r\n            submit\r\n              │\r\n              ▼\r\n          ┌────────┐  cancel（还没开始）\r\n          │ queued │──────────────────────────┐\r\n          └────────┘                          │\r\n              │ _execute                      ▼\r\n              ▼                         ┌───────────┐\r\n          ┌─────────┐  progress 抛     │ cancelled │\r\n          │ running │─ Cancelled ─────►└───────────┘\r\n          └─────────┘\r\n           │       │\r\n     正常返回     抛异常\r\n           ▼       ▼\r\n   ┌───────────┐ ┌────────┐\r\n   │ succeeded │ │ failed │\r\n   └───────────┘ └────────┘\r\n\r\n  服务重启时仍是 queued / running 的 → interrupted\r\n```\r\n\r\n`queued` 和 `running` 合称「活跃」（`ACTIVE`，`tasks.py:10`）。其他都是终态。\r\n\r\n## 两种执行方式\r\n\r\n```python\r\n# backend/tasks.py:61\r\ndef submit(self, kind, function, session_ids=(), audio_ids=(), title="", line_ids=(), concurrent=False):\r\n    with self.store.lock:\r\n        if self.closed:\r\n            raise ValueError("服务正在停止")\r\n        task = self.store.create("tasks", {...})\r\n        if concurrent:\r\n            Thread(target=self._execute, args=(task["id"], function), daemon=True).start()\r\n        else:\r\n            self.queue.put((task["id"], function))\r\n        return task\r\n```\r\n\r\n### 串行：一个 worker，一个队列\r\n\r\n默认路径。`Tasks` 构造时启动唯一的 worker 线程（`tasks.py:45`）：\r\n\r\n```python\r\n# backend/tasks.py:145\r\ndef _run(self):\r\n    while (item := self.queue.get()) is not None:\r\n        try:\r\n            self._execute(*item)\r\n        finally:\r\n            self.queue.task_done()\r\n```\r\n\r\n`queue.get()` 在队列为空时阻塞，不占 CPU；`submit` 里的 `put` 把它唤醒。这是标准的生产者-消费者，worker 这一侧没有定时轮询。\r\n\r\n只用一个 worker，是因为原版推理（`IndexTTS.infer`）不能并发调用：它在实例上缓存参考音频的 Mel、在实例上挂进度回调，两个线程同时调用会互相覆盖这些状态。因此所有串行任务排成一队执行。此外，显存占用也因此可预测：任意时刻最多只有一个原版推理在执行。\r\n\r\n### 并发：自带调度的任务\r\n\r\n`concurrent=True` 的任务当场开线程。它们不受串行队列的约束，所以函数必须自己负责 GPU 协调。目前只有 `batch` 模式的生成走这里（单句、台本，以及外部 API）：它们的线程不使用模型，只是把作业交给 `Engine` 的批处理线程，再等待结果（第 05 章）。\r\n\r\n一句话总结：**串行队列保护的是原版推理，并发任务保护自己。**\r\n\r\n## 执行与终态\r\n\r\n```python\r\n# backend/tasks.py:152\r\ndef _execute(self, key, function):\r\n    try:\r\n        with self.store.lock:\r\n            task = self.store.get("tasks", key)\r\n            if task["cancel_requested"]:\r\n                return\r\n            task.update(status="running", started_at=now())\r\n            self.store.save("tasks", task)\r\n        result = function(lambda value=None, desc="": self.progress(key, value, desc))\r\n        self.progress(key, 1, "完成")\r\n        self._finish(key, "succeeded", result=result)\r\n    except Cancelled:\r\n        self._finish(key, "cancelled", message="已取消")\r\n    except Exception as error:\r\n        self._finish(key, "failed", error=str(error), message=str(error))\r\n```\r\n\r\n函数的结束方式决定任务的终态：正常返回是 `succeeded`，抛 `Cancelled` 是 `cancelled`，抛别的异常是 `failed`，异常消息直接显示在网页上。业务代码因此无需修改任务状态，只需返回结果或抛出异常。\r\n\r\n`_finish`（`tasks.py:170`）写终态后 `notify_all` 一个条件变量 `finished`，唤醒在 `wait()` 里等的线程。外部 API 就靠 `wait()` 同步等结果（第 06 章）。\r\n\r\n## 进度与取消\r\n\r\n`progress` 是传给业务函数的唯一回调：\r\n\r\n```python\r\n# backend/tasks.py:135\r\ndef progress(self, key, value=None, desc=""):\r\n    with self.store.lock:\r\n        task = self.store.get("tasks", key)\r\n        if task["cancel_requested"]:\r\n            raise Cancelled()\r\n        if value is not None:\r\n            task["progress"] = min(1, max(0, float(value)))\r\n        task["message"] = desc\r\n        self.store.save("tasks", task)\r\n```\r\n\r\n它同时做两件事：写进度，检查取消。取消请求本身只是改一个标志：\r\n\r\n```python\r\n# backend/tasks.py:124\r\ndef cancel(self, key):\r\n    with self.store.lock:\r\n        task = self.store.get("tasks", key)\r\n        if task["status"] in ACTIVE:\r\n            task["cancel_requested"] = True\r\n            if task["status"] == "queued":\r\n                task["status"] = "cancelled"\r\n            task["message"] = "取消已请求，等待安全边界"\r\n            self.store.save("tasks", task)\r\n        return task\r\n```\r\n\r\n- 还在排队的任务直接变成 `cancelled`。轮到它时 `_execute` 看到标志就跳过。\r\n- 正在运行的任务要等它下一次调用 `progress`。那时 `progress` 抛出 `Cancelled`，异常一路冒泡到 `_execute`。\r\n\r\nPython 没有安全地杀死线程的办法，GPU kernel 也不能中途打断，所以取消只能是**协作式**的：任务在自己选定的「安全边界」检查标志。取消的粒度因此等于调用 `progress` 的频率：\r\n\r\n| 任务 | 多久检查一次 |\r\n|---|---|\r\n| `normal` / `fast` 推理 | 每句话、每个阶段（`IndexTTS._set_gr_progress`） |\r\n| `batch` 推理 | 每 0.5 秒（`engine.py:21` 的 `POLL`） |\r\n| 台本串行生成 | 每句话 |\r\n| 合并 | 每段音频 |\r\n\r\n一个句子开始解码后，它会解完再停。\r\n\r\n## 防止冲突\r\n\r\n任务记录里的 `session_ids` 起到锁的作用。编辑 session 的方法会先检查：\r\n\r\n```python\r\n# backend/tasks.py:99\r\ndef ensure_idle(self, session_ids):\r\n    if any(t["status"] in ACTIVE and set(t["session_ids"]) & set(session_ids)\r\n           for t in self.store.list("tasks")):\r\n        raise Busy("该 session 有排队或运行中的任务，请等待完成或取消后操作")\r\n```\r\n\r\n`Busy` 映射成 HTTP 409。重排句子、替换台本、清理 take、删除 session 都会先调它；修改单句文本、选择 take 不会，因为生成过程允许这样的编辑（一致性的保证见第 06 章）。\r\n\r\n`audio_ids` 同理：`active_audio_ids()`（`tasks.py:106`）返回正在使用的音频，删除音频前会检查它。\r\n\r\n## 重启与清理\r\n\r\n`Tasks.__init__`（`tasks.py:23`）在启动时扫一遍任务记录：\r\n\r\n- 30 天前结束的任务直接删除；\r\n- 仍是 `queued` 或 `running` 的任务改成 `interrupted`，消息是「服务重启，任务未自动重试」。\r\n\r\n不自动重试是有意的：重启前的任务可能就是导致崩溃的那个，自动重试会让服务陷入循环。\r\n\r\n服务停止时，`close()`（`tasks.py:175`）拒绝新任务、取消所有活跃任务，然后往队列里放一个 `None` 让 worker 退出循环。\r\n\r\n## 本章对应文件\r\n\r\n- `backend/tasks.py:23` — 启动时的清理与 worker\r\n- `backend/tasks.py:61` — `submit`\r\n- `backend/tasks.py:99`、`:106` — 资源冲突检查\r\n- `backend/tasks.py:114` — `wait`\r\n- `backend/tasks.py:124`、`:135` — 取消与进度\r\n- `backend/tasks.py:145`、`:152`、`:170` — worker、执行、终态\r\n',engine:`\`Engine\`（\`backend/engine.py\`）是后端与模型之间唯一的接口。它负责：模型的加载与卸载；两条推理路径共用一份权重；Whisper 字幕与 TTS 轮流使用显存。\r
\r
## 懒加载\r
\r
服务启动时不加载模型。第一次需要推理时才加载：\r
\r
\`\`\`python\r
# backend/engine.py:105\r
def load(self, progress=None):\r
    if self.tts is not None:\r
        return self.status()\r
    with self.gate.exclusive():\r
        if self.tts is not None:\r
            return self.status()\r
        self.state, self.error = "loading", None\r
        try:\r
            from indextts.infer import IndexTTS\r
            self.tts = IndexTTS(model_dir=..., cfg_path=..., use_cuda_kernel=False)\r
            self.state = "loaded"\r
        except Exception as error:\r
            self.tts = None\r
            self.state, self.error = "error", str(error)\r
            raise\r
        return self.status()\r
\`\`\`\r
\r
几个细节：\r
\r
- \`from indextts.infer import IndexTTS\` 写在函数里。导入它会拉进 torch、transformers 等重型依赖，放在函数内，服务启动时不导入 torch（\`backend/\` 里的 torch 导入都在函数内），直到第一次加载模型。\r
- 检查 \`self.tts is not None\` 做了两次。第一次在锁外，已加载时快速返回；第二次在锁内，防止两个请求同时发现「未加载」后各自加载一份。这是经典的双重检查。\r
- \`state\` 有五个值：\`unloaded\`、\`loading\`、\`loaded\`、\`unloading\`、\`error\`。前端轮询 \`/api/models\` 读取它，侧栏的指示灯就是这个值。\r
\r
手动加载和卸载是普通的串行任务（\`generation.py:20-24\`），和生成任务一起排队。\r
\r
卸载把引用置空，再清理显存：\r
\r
\`\`\`python\r
# backend/engine.py:133\r
def _drop(self):\r
    self.state = "unloading"\r
    self.tts = self.scheduler = None\r
    free_cuda()     # gc.collect() + torch.cuda.empty_cache()\r
    self.state, self.error = "unloaded", None\r
\`\`\`\r
\r
## Gate：共享锁与独占锁\r
\r
使用同一份权重的有：\r
\r
- 串行 worker 上的原版推理（\`normal\` / \`fast\`）；\r
- \`webui-batch\` 线程上的连续批处理（\`batch\`）；\r
- 加载、卸载（改变权重是否存在）；\r
- Whisper 字幕（要求 TTS 不在显存里）。\r
\r
前两者可以同时读权重；后两者必须独占。这正是读写锁的语义。\`Gate\`（\`engine.py:54\`）用一个条件变量实现：\r
\r
\`\`\`python\r
# backend/engine.py:62\r
@contextmanager\r
def shared(self):\r
    with self.changed:\r
        while self.writer or self.waiting:\r
            self.changed.wait()\r
        self.readers += 1\r
    try:\r
        yield\r
    finally:\r
        with self.changed:\r
            self.readers -= 1\r
            self.changed.notify_all()\r
\r
@contextmanager\r
def exclusive(self):\r
    with self.changed:\r
        self.waiting += 1\r
        while self.writer or self.readers:\r
            self.changed.wait()\r
        self.waiting -= 1\r
        self.writer = True\r
    ...\r
\`\`\`\r
\r
注意 \`shared()\` 的等待条件里有 \`self.waiting\`：只要有人在等独占锁，新来的读者也要等。这叫**写者优先**。没有这一条的话，\`batch\` 请求源源不断时读者永远不会归零，用户点的「卸载模型」会一直等下去。\r
\r
| 使用者 | 锁 |\r
|---|---|\r
| \`Engine.infer\`（\`normal\` / \`fast\`） | 共享 |\r
| \`Engine._serve\`（\`batch\`） | 共享，只要还有行在解码就一直持有 |\r
| \`Engine.load\` / \`unload\` | 独占 |\r
| \`Engine.subtitles\` | 独占 |\r
\r
## \`_loaded\`：加载并持共享锁\r
\r
推理前需要两件事：模型已加载，并且在推理期间不会被卸载。\`_loaded\` 把它们合成一个上下文：\r
\r
\`\`\`python\r
# backend/engine.py:140\r
@contextmanager\r
def _loaded(self, progress=None):\r
    while True:\r
        self.load(progress)\r
        with self.gate.shared():\r
            if self.tts is not None:\r
                yield\r
                return\r
\`\`\`\r
\r
这里需要循环：\`load()\` 返回时独占锁已经释放，到 \`shared()\` 获得锁之间存在间隙，用户的卸载请求可能在此期间执行。因此获得共享锁后要再检查一次 \`tts\`；如果被卸载了，就退出共享锁、重新加载、再试。\r
\r
这样「生成时自动加载」和「手动卸载」可以任意交错，不会出现推理读到 \`None\` 的情况，也不会重复加载。\r
\r
## 原版推理入口\r
\r
\`\`\`python\r
# backend/engine.py:150\r
def infer(self, source, text, output, settings, progress):\r
    with self._loaded(progress):\r
        options = dict(settings)\r
        for name in FLOAT_OPTIONS:\r
            options[name] = float(options[name])\r
        options["top_k"] = options["top_k"] or None\r
        fast = options.pop("mode") == "fast"\r
        if not fast:\r
            options.pop("sentences_bucket_max_size", None)\r
        self.tts.gr_progress = progress\r
        try:\r
            method = self.tts.infer_fast if fast else self.tts.infer\r
            method(str(source), text, str(output), **options)\r
        finally:\r
            self.tts.gr_progress = None\r
\`\`\`\r
\r
网页上的 \`generation\` 参数在这里翻译成 \`IndexTTS\` 的关键字参数：\r
\r
- 旧 JSON 可能把 \`1.0\` 存成 \`1\`，而 transformers 对某些参数要求 float，所以统一转换；\r
- \`top_k=0\` 在网页上表示「不限制」，HF 用 \`None\` 表示；\r
- \`mode\` 不是模型参数，取出来用于选择方法；\r
- \`sentences_bucket_max_size\` 只有 \`infer_fast\` 接受。\r
\r
\`gr_progress\` 是 \`IndexTTS\` 里留给 Gradio 的进度钩子（\`infer.py:273\`）。这里把任务系统的 \`progress\` 挂上去，原版推理每处理一句就会调用它，取消因此在句子边界生效。用完在 \`finally\` 里摘掉，避免下一个任务的进度写到这个任务上。\r
\r
这个方法只会被串行 worker 调用，所以修改实例属性 \`gr_progress\` 是安全的。\r
\r
## 连续批处理入口\r
\r
\`batch\` 模式的调用方（并发任务线程）调用 \`synthesize_many\`：\r
\r
\`\`\`python\r
# backend/engine.py:171\r
def synthesize_many(self, items, progress, saved=None):\r
    jobs = [Job(source, text, settings) for source, text, _, settings in items]\r
    with self.arrived:\r
        if self.server is None:\r
            self.server = Thread(target=self._serve, daemon=True, name="webui-batch")\r
            self.server.start()\r
        self.pending += jobs\r
        self.arrived.notify()\r
    waiting = list(range(len(jobs)))\r
    try:\r
        while waiting:\r
            # 完成一个就写一个 WAV，调用 saved(index)\r
            ...\r
            jobs[waiting[0]].done.wait(POLL)\r
            progress(sum(j.progress() for j in jobs) / len(jobs), ...)\r
    except BaseException:\r
        for job in jobs:\r
            job.cancelled = True\r
        raise\r
\`\`\`\r
\r
调用线程负责：把 \`Job\` 放进 \`pending\` 并唤醒批处理线程；每 0.5 秒醒来一次，写完成的 WAV、汇报进度；进度回调抛 \`Cancelled\` 时把自己的作业全部标成取消。\r
\r
真正的解码在 \`_serve\`（\`engine.py:208\`）：\r
\r
\`\`\`python\r
while True:\r
    with self.arrived:\r
        while not self.pending:\r
            self.arrived.wait()\r
    with self._loaded():\r
        if self.scheduler is None:\r
            self.scheduler = Scheduler(self.tts, BATCH_ROWS)\r
        while True:\r
            if not self.gate.waiting:\r
                jobs, self.pending = self.pending, []\r
                for job in jobs:\r
                    scheduler.submit(job)\r
            if not scheduler.busy():\r
                break\r
            scheduler.step()\r
\`\`\`\r
\r
- 没有作业时阻塞在 \`arrived.wait()\`，不占资源。\r
- 有作业时持共享锁，一直 \`step()\` 到调度器空闲才释放。\r
- **有人在等独占锁时（\`gate.waiting\`）不接新作业。** 已在解码的行结束后调度器变空，循环退出并释放共享锁，等待中的加载、卸载或字幕任务随即获得独占锁。新作业留在 \`pending\` 里，下一轮再处理。\r
\r
所有 \`batch\` 解码集中在一个线程，原因在于连续批处理的目的就是把不同请求的句子放进同一个张量批里，一次前向算完。如果每个请求一个线程，它们各自前向，就退化成了并发的单句推理。\`Scheduler\` 本身也不是线程安全的，只能由一个线程驱动（第 13 章）。\r
\r
\`BATCH_ROWS = 24\`（\`engine.py:20\`）是同时解码的最大行数。best-of-3 时相当于 8 个句子并行，在 8 GB 的 RTX 4060 上峰值约 2.6 GiB。\r
\r
## Whisper 字幕\r
\r
\`\`\`python\r
# backend/engine.py:243\r
def subtitles(self, source, output, model, language, progress):\r
    with self.gate.exclusive():\r
        if self.tts is not None:\r
            self._drop()\r
        self._transcribe(source, output, model, language, progress)\r
\`\`\`\r
\r
字幕任务持独占锁，先卸载 TTS，再加载 Whisper。两个模型都放在显存里，小显卡会 OOM，所以设计成轮流使用。识别结束后 Whisper 随即释放；下一次 TTS 推理会通过 \`_loaded\` 自动重新加载。\r
\r
\`_transcribe\` 先用 ffmpeg 把音频转成 16 kHz 单声道，再交给 transformers 的 \`pipeline\`，最后把带时间戳的分段写成 SRT，并用 OpenCC 转成简体。\r
\r

- \`backend/engine.py:171\`、\`:208\` — 连续批处理的调用侧与服务线程\r
- \`backend/engine.py:243\` — 字幕\r
`,features:'这一章逐个看各功能的实现：单句生成、台本、合并、字幕、外部 API。它们的写法相同：在 `Generation`（或 `Apis`）里组织参数，封一个 `run(progress)` 闭包，交给 `Tasks.submit`。\r\n\r\n## 单句生成\r\n\r\n流程见第 02 章。补充：\r\n\r\n- 输出放在 `data/outputs/<随机 id>.wav`，登记的显示名是文本的前 40 个字符，去掉 Windows 文件名不允许的字符（`audio.py:14` 的 `title`）。下载时再加上扩展名。\r\n- 推理失败时 `run` 会删掉写了一半的文件再抛出异常，`data/` 里不会留下没有记录的孤儿文件。\r\n\r\n## 台本：project、session、line、take\r\n\r\n有声书和多人对话的数据结构有四层：\r\n\r\n```\r\nproject            只是一个名字，用来分组\r\n  └─ session       一组说话人绑定 + 推理参数 + 句子列表\r\n       └─ line     一句话：说话人、文本\r\n            └─ take    这句话的一次生成结果\r\n```\r\n\r\nsession 记录（`sessions/<id>.json`）里存着全部句子和 take，一个文件就是一份完整的台本。项目关系只是 session 上的 `project_id` 字段，session 的音频不放在项目目录下（`sessions.py:11`）。\r\n\r\n```json\r\n{\r\n  "id": "s1", "name": "第一章", "project_id": "p1",\r\n  "bindings": [{ "speaker": "旁白", "role_id": "...", "audio_id": "..." }],\r\n  "generation": { "mode": "batch", "num_beams": 3, ... },\r\n  "lines": [{\r\n    "id": "l1", "index": 0, "speaker": "旁白", "text": "夜深了。",\r\n    "takes": [{ "id": "t1", "take_index": 1, "snapshot": { ... } }],\r\n    "current_take_id": "t1", "next_take_index": 2,\r\n    "revision": 0, "selection_revision": 0\r\n  }],\r\n  "interval": 0.5, "outputs": []\r\n}\r\n```\r\n\r\ntake 的音频文件路径是推算出来的，不单独登记：\r\n\r\n```python\r\n# backend/sessions.py:28\r\ndef take_file(session, line_id, take):\r\n    return f"{folder(session[\'id\'])}/takes/{line_id}/{take[\'take_index\']}_{take[\'id\']}.wav"\r\n```\r\n\r\n### 编辑台本\r\n\r\n台本编辑器整体提交一个句子列表（`PUT /api/sessions/{key}/script`），`apply_script`（`sessions.py:162`）按顺序重建 `lines`：\r\n\r\n- 带 `line_id` 的条目保留原句（包括它的 take）；说话人或文本变了，`revision` 加一。\r\n- 不带 `line_id` 的是新句子。\r\n- 列表里没出现的句子被移除，但它们的 take 文件暂时留在磁盘上，等「清理孤儿」时再删。手滑删了一句话不会立刻丢掉音频。\r\n\r\n### 生成：先预留，再执行\r\n\r\n点「生成全部」或单句的「生成」，进入 `Generation.session`（`generation.py:74`）。第一步在锁内为每句预留一个 take：\r\n\r\n```python\r\n# backend/sessions.py:247\r\ndef reserve(self, key, line_ids=None):\r\n    ...\r\n    snapshots = [self.snapshot(session, line) for line in lines]\r\n    for line, snapshot in zip(lines, snapshots):\r\n        take = {"id": uid(), "take_index": line["next_take_index"], "snapshot": snapshot, ...}\r\n        line["next_take_index"] += 1\r\n        jobs.append({"line_id": ..., "take": take, "path": ...,\r\n                     "revision": line["revision"], "selection_revision": line["selection_revision"]})\r\n```\r\n\r\n**快照**（`sessions.py:235`）是这一句生成时的全部输入：文本、说话人、绑定的参考音频、推理参数的深拷贝。之后用户改了绑定或参数，已生成的 take 仍保留其生成条件，前端可以把「快照与当前设置不一致」的 take 标出来。\r\n\r\n所有句子的快照先全部算好，再分配 take。任何一句没有绑定参考音频，整个请求在这一步就失败，不会出现生成到一半才报错的情况。\r\n\r\n第二步按模式选择执行方式（`generation.py:122`）：\r\n\r\n```python\r\nif is_batch(jobs[0]["take"]["snapshot"]["generation"]):\r\n    return self.tasks.submit("session-generate", run_batch, [key], audio_ids, title, line_ids, concurrent=True)\r\nreturn self.tasks.submit("session-generate", run, [key], audio_ids, title, line_ids)\r\n```\r\n\r\n- `run`（串行）逐句调用 `engine.infer`，每句完成后立刻调 `sessions.complete` 入库。\r\n- `run_batch`（并发）把所有句子一次交给 `engine.synthesize_many`，通过 `saved(index)` 回调在每句完成时入库。句子可能乱序完成，但每句只更新自己那一行。\r\n\r\n两种方式都是「完成一句、保存一句」。取消或失败时，已完成的 take 保留，未完成的文件被删除。\r\n\r\n### 生成期间的编辑\r\n\r\n生成一篇台本可能要几分钟。这期间用户可以继续改某句的文本、切换某句的当前 take（这两个操作不检查 `ensure_idle`）。生成完成时，需要决定新 take 是否设为当前。\r\n\r\n```python\r\n# backend/sessions.py:280\r\ndef complete(self, key, job):\r\n    def change(session):\r\n        line = find_line(session, job["line_id"])\r\n        line["takes"].append(job["take"])\r\n        # Keep a selection or edit the user made while this take was generating.\r\n        if (line["revision"], line["selection_revision"]) == (job["revision"], job["selection_revision"]):\r\n            line["current_take_id"] = job["take"]["id"]\r\n```\r\n\r\n`reserve` 时记下了这句的两个版本号。完成时如果版本号没变，说明用户没动过这句，新 take 成为当前；如果变了（改了文本，或手动选了别的 take），新 take 只是加进列表，不覆盖用户的选择。这是一个轻量的乐观并发控制，不需要在生成期间锁住整个 session。\r\n\r\n会改变句子结构的操作（重排、替换台本、删除句子、清理 take）则必须等任务结束，它们开头都调用 `ensure_idle`，冲突时返回 409。\r\n\r\n### 清理\r\n\r\ntake 越积越多。`cleanup`（`sessions.py:307`）有两个开关：\r\n\r\n- `unused`：删除每句里非当前的 take；\r\n- `orphans`：删除已不存在的句子遗留的 `takes/<line_id>/` 文件夹。\r\n\r\n删除失败的文件（例如正被播放器占用）会被记录下来，对应的 take 保留在记录里，下次可以再试。\r\n\r\n## 合并\r\n\r\n`Generation.merge`（`generation.py:126`）提交一个串行任务。`_merge` 在锁内收集每句当前 take 的路径，然后用 pydub 拼接，句子之间插入 `session["interval"]` 秒的静音，导出到 `sessions/<id>/merged/`，登记为 `audio` 记录并追加到 session 的 `outputs`。\r\n\r\n只要有一句没有当前 take，合并就直接报错，不会生成缺句的成品。\r\n\r\n合并不使用模型，但它在串行队列中，会排在 `normal` / `fast` 的生成任务之后。\r\n\r\n## 字幕\r\n\r\n`Generation.subtitles`（`generation.py:63`）提交一个串行任务，调用 `engine.subtitles`。产出的 `.srt` 放在 `outputs/`，同样登记成 `audio` 记录（`register` 允许 `.srt` 扩展名），所以它出现在「最近生成」里，可以直接下载。\r\n\r\n## 外部 API\r\n\r\n外部 API 让听书软件、脚本等程序通过 HTTP 合成语音。和网页功能的区别：调用方需要同步获得 WAV；生成的音频不保存；访问需要校验。\r\n\r\n### 配置\r\n\r\n每个 API 是一条 `apis/<id>.json`（`schemas.py:85`）：\r\n\r\n| 字段 | 含义 |\r\n|---|---|\r\n| `slug` | 地址 `/tts/<slug>`，大小写不敏感，不可重复 |\r\n| `access` | `public`：GET 或 POST，无认证；`private`：仅 POST，带 `Authorization: Bearer <token>` |\r\n| `enabled` | 停用后地址返回 404，配置保留 |\r\n| `voices` | 保存的音色：名字 → 参考音频 |\r\n| `generation` | 默认推理参数，调用方可在 POST 的 `generation` 里逐项覆盖 |\r\n\r\n`Apis.find`（`apis.py:80`）按 slug 找到配置并校验访问方式和 token，失败时抛 `Denied`。token 比较用 `secrets.compare_digest`，避免时序攻击。\r\n\r\n### 音色解析\r\n\r\n`voice` 参数可以是以下任意一种（`apis.py:104`）：\r\n\r\n1. 这个 API 保存的音色名；\r\n2. 任意参考音频的 id；\r\n3. `samples/` 里的相对路径，例如 `旁白/01.wav`。\r\n\r\n保存的音色只是快捷方式，不是白名单。`GET /tts/<slug>/voices` 列出所有可用值。\r\n\r\n### 同步返回 WAV\r\n\r\n外部调用方要的是「请求进去，WAV 出来」。后端内部却是异步的任务系统。`Apis.synthesize`（`apis.py:121`）把两者接起来：\r\n\r\n```python\r\nsettings = S.Generation(**{**api["generation"], **(overrides or {})}).model_dump()\r\nhandoff = Handoff()\r\ntask = self.generation.speak(self.resolve(api, voice), text, settings, "api", api["name"],\r\n                             handoff.deliver, batched=True)\r\nfinished = self.tasks.wait(task["id"], WAIT)        # 最多等 600 秒\r\nif finished is None:\r\n    self.tasks.cancel(task["id"])\r\nif not finished or finished["status"] != "succeeded":\r\n    handoff.abandon()\r\nreturn finished, handoff.path\r\n```\r\n\r\n- 合并默认参数与覆盖项后重新校验，调用方传了非法值会得到 400。\r\n- `batched=True`：外部 API 总是走连续批处理，不进串行队列。因此网页上正在执行的长台本（`normal` 模式）不会阻塞外部调用。\r\n- `Tasks.wait` 阻塞调用线程，直到任务结束。POST 路由用 `run_in_threadpool` 调用它，不会卡住事件循环。\r\n- 每次调用都在服务器控制台打一行日志：slug、音色、字数、状态、字节数、耗时。\r\n\r\n### 临时文件的交接\r\n\r\n外部 API 的音频不进入音频库。`speak` 收到 `deliver` 参数时走另一条分支（`generation.py:39`）：\r\n\r\n```python\r\nif deliver:\r\n    handle, name = tempfile.mkstemp(suffix=".wav")\r\n    os.close(handle)\r\n    path = Path(name)\r\n    try:\r\n        infer(source, text, path, settings, progress)\r\n        size = path.stat().st_size\r\n    except BaseException:\r\n        path.unlink(missing_ok=True)\r\n        raise\r\n    deliver(path)\r\n    return {"size": size}\r\n```\r\n\r\n文件写在系统临时目录，不登记；`deliver(path)` 把它交出去。难点在于交给谁：请求线程可能已经因为超时放弃了，而生成线程还不知道。`Handoff`（`apis.py:29`）就是处理这个竞态的小对象：\r\n\r\n```python\r\nclass Handoff:\r\n    def deliver(self, path):          # 生成线程调用\r\n        with self.lock:\r\n            if self.abandoned:\r\n                path.unlink(missing_ok=True)\r\n            else:\r\n                self.path = path\r\n\r\n    def abandon(self):                # 请求线程放弃时调用\r\n        with self.lock:\r\n            self.abandoned = True\r\n            if self.path:\r\n                self.path.unlink(missing_ok=True)\r\n                self.path = None\r\n```\r\n\r\n不管 `deliver` 和 `abandon` 谁先发生，文件都恰好被删除一次：\r\n\r\n| 顺序 | 结果 |\r\n|---|---|\r\n| 先 `deliver`，请求成功 | 路由用 `FileResponse` 发送，`BackgroundTask` 在发送完后删除（`routes.py:364`） |\r\n| 先 `deliver`，后 `abandon` | `abandon` 删除已交付的文件 |\r\n| 先 `abandon`，后 `deliver` | `deliver` 看到标志，直接删除新文件 |\r\n\r\n文件的归属因此每一刻都很明确：生成中归生成线程；`deliver` 之后归 `Handoff`；响应阶段归 `FileResponse`，发完即删。\r\n\r\n### 兼容听书软件\r\n\r\n听书软件的请求能力有限：只能发 GET，或发表单字段，不能构造 JSON。所以 `POST /tts/<slug>` 同时接受 JSON、表单和 URL 参数（`routes.py:391`）。\r\n\r\n`backend/profiles.py` 把保存的音色生成为阅读（legado）、服务端阅读、爱阅记的朗读引擎配置，格式参考 yy4382/tts-importer。软件可以通过 `/tts/<slug>/profile/<app>` 直接网络导入；私有 API 的 token 这时通过 `?token=` 传入，因为它本来就会写进配置。\r\n\r\n## 本章对应文件\r\n\r\n- `backend/sessions.py:162` — 台本替换\r\n- `backend/sessions.py:235`、`:247`、`:280` — 快照、预留、完成\r\n- `backend/sessions.py:307` — 清理\r\n- `backend/generation.py:63`、`:74`、`:126` — 字幕、台本生成、合并\r\n- `backend/apis.py:29`、`:80`、`:104`、`:121` — `Handoff`、访问校验、音色解析、同步合成\r\n- `backend/routes.py:355` — `/tts` 路由\r\n- `backend/profiles.py` — 听书配置\r\n',infer:'从这一章开始进入模型内部。本章给出全貌：模型的组成、`IndexTTS.infer` 处理一句话的步骤，以及各步骤的张量形状。第 08–13 章逐段展开。\r\n\r\n## 推理流程\r\n\r\nIndexTTS 1.5 的推理流程：\r\n\r\n```\r\n文本 ──► 文本 token ─┐\r\n                     ├──► GPT 自回归生成 ──► 离散声学码 ──► GPT 再前向一次 ──► BigVGAN ──► 波形\r\n参考音频 ──► Mel ────┘                                     （得到连续向量）\r\n```\r\n\r\n- **内容**来自文本：文本被切成 token，作为 GPT 的输入。\r\n- **音色**来自参考音频：它被转换成 Mel 频谱，再压缩成 32 个向量，放在 GPT 输入的最前面。\r\n- **时长**由 GPT 生成了多少个声学码决定。每个码对应 42.7 毫秒的音频，GPT 自己决定何时输出停止符。\r\n- **波形**由声码器 BigVGAN 生成。它把每个码对应的连续向量上采样成 1024 个采样点。\r\n\r\nGPT 的生成方式与语言模型相同：根据前面的序列预测下一个 token。这里的 token 是声学码。\r\n\r\n## 模型组件\r\n\r\n模型在 `Engine.load` 第一次被调用时构造（第 05 章）。`IndexTTS.__init__`（`indextts/infer.py:27`）依次构造 GPT、BigVGAN 和文本前端：\r\n\r\n```python\r\n# indextts/infer.py:74\r\nself.gpt = UnifiedVoice(**self.cfg.gpt)\r\nload_checkpoint(self.gpt, "gpt.pth")\r\nself.gpt.to(device).eval().half()\r\nself.gpt.post_init_gpt2_config(kv_cache=True)\r\n\r\nself.bigvgan = Generator(self.cfg.bigvgan)\r\nself.bigvgan.load_state_dict(torch.load("bigvgan_generator.pth")["generator"])\r\nself.bigvgan.remove_weight_norm()\r\nself.bigvgan.eval()\r\n\r\nself.normalizer = TextNormalizer()\r\nself.normalizer.load()\r\nself.tokenizer = TextTokenizer("bpe.model", self.normalizer)\r\n```\r\n\r\n| 组件 | 代码 | 参数量 | 作用 |\r\n|---|---|---|---|\r\n| GPT（`UnifiedVoice`） | `gpt/model.py:300` | 约 5.9 亿 | 文本 + 音色 → 声学码；也包含音色编码器 |\r\n| BigVGAN | `BigVGAN/models.py:130` | 约 1.34 亿 | 连续向量 → 波形 |\r\n| 文本前端 | `utils/front.py` | 无 | 归一化、分词、分句 |\r\n\r\n`checkpoints/` 里的文件：\r\n\r\n| 文件 | 大小 | 推理是否加载 |\r\n|---|---|---|\r\n| `gpt.pth` | 1.1 GB | 是 |\r\n| `bigvgan_generator.pth` | 511 MB | 是 |\r\n| `bpe.model` | 0.5 MB | 是 |\r\n| `config.yaml` | — | 是 |\r\n| `dvae.pth` | 232 MB | **否** |\r\n\r\n`dvae.pth` 是离散自编码器，作用是把真实录音压成声学码，用来给训练数据打标签。推理时声学码由 GPT 直接生成，用不到它，`infer.py:61-73` 对应的加载代码被整段注释掉了。\r\n\r\n## config.yaml 是结构说明书\r\n\r\n`checkpoints/config.yaml` 决定每一层有多大。权重用 `load_state_dict(strict=True)` 加载，配置里改错一个数字就会因为形状不匹配而失败。\r\n\r\nGPT 部分：\r\n\r\n| 参数 | 值 | 含义 |\r\n|---|---|---|\r\n| `layers` / `model_dim` / `heads` | 24 / 1280 / 20 | 24 层 Transformer，隐藏维度 1280，每层 20 头 |\r\n| `number_text_tokens` | 12000 | 文本词表大小 |\r\n| `number_mel_codes` | 8194 | 8192 个声学码 + `start_mel` + `stop_mel` |\r\n| `max_mel_tokens` | 800 | 声学码位置表的长度上限 |\r\n| `mel_length_compression` | 1024 | 一个码对应的采样点数 |\r\n| `condition_type` | `conformer_perceiver` | 音色编码器的类型（第 09 章） |\r\n| `condition_num_latent` | 32 | 音色压缩后的向量数 |\r\n\r\nBigVGAN 部分：\r\n\r\n| 参数 | 值 | 含义 |\r\n|---|---|---|\r\n| `gpt_dim` | 1280 | 输入维度，必须与 GPT 一致 |\r\n| `upsample_rates` | `[4,4,4,4,2,2]` | 乘积 1024，与 `mel_length_compression` 一致 |\r\n| `num_mels` | 100 | 参考 Mel 的频带数 |\r\n| `speaker_embedding_dim` | 512 | 说话人向量维度 |\r\n\r\n`vqvae` 段只在训练时使用，推理不读。\r\n\r\n## 接入 HuggingFace 的生成循环\r\n\r\n`post_init_gpt2_config`（`gpt/model.py:388`）创建一个 HF 兼容的包装：\r\n\r\n```python\r\n# indextts/gpt/model.py:400\r\nself.inference_model = GPT2InferenceModel(\r\n    gpt_config, self.gpt, self.mel_pos_embedding,\r\n    self.mel_embedding, self.final_norm, self.mel_head,\r\n    kv_cache=True,\r\n)\r\n```\r\n\r\n传进去的是模块对象本身，不是副本。`inference_model` 与 `UnifiedVoice` 共用同一套权重，包装的唯一目的是接上 transformers 的 `generate()`：beam search、采样器、KV cache 都由 HF 实现，项目不用自己写解码循环（第 13 章的连续批处理则恰好相反，它自己写了循环）。\r\n\r\n**KV cache** 是自回归生成的标准加速：生成第 n 个 token 时，前面 n-1 个 token 在每一层的 Key/Value 已经算过，缓存起来直接复用，每步只需对 1 个新 token 做前向。没有它，每一步都要对前面全部 token 重新做前向。\r\n\r\n## 半精度与显存\r\n\r\nGPT 权重转成 fp16（`.half()`），BigVGAN 保持 fp32。前向时用 `torch.amp.autocast(dtype=torch.float16)` 包住（`infer.py:384`、`:572`），让矩阵乘、卷积以 fp16 计算。\r\n\r\n显存大致是：GPT 权重约 1.1 GB，BigVGAN 约 0.5 GB，再加上随文本长度增长的 KV cache 和激活。总权重约 1.6 GB，所以 8 GB 显卡可以运行；长文本的主要压力来自 KV cache。\r\n\r\n## infer 处理一句话的步骤\r\n\r\n`IndexTTS.infer`（`infer.py:500`）的主流程：\r\n\r\n| 步骤 | 代码 | 细节在 |\r\n|---|---|---|\r\n| 1. 读参考音频，算 Mel，命中则用缓存 | `infer.py:508` | 第 08 章 |\r\n| 2. 文本归一化、分词、分句 | `infer.py:528` | 第 08 章 |\r\n| 3. 对每句：Mel → 32 个音色向量 | `get_conditioning` | 第 09 章 |\r\n| 4. 对每句：GPT 自回归生成声学码 | `infer.py:573` `inference_speech` | 第 10 章 |\r\n| 5. 对每句：压缩过长的静音 | `infer.py:605` | 第 10 章 |\r\n| 6. 对每句：GPT 再前向一次得到连续向量 | `infer.py:615` | 第 11 章 |\r\n| 7. 对每句：BigVGAN 生成波形 | `infer.py:622` | 第 11 章 |\r\n| 8. 拼接所有句子的波形，保存 WAV | `infer.py:653` | 第 11 章 |\r\n\r\n`infer_fast` 和连续批处理改变的是步骤 3–7 的执行方式（多句一起算），每句的计算内容相同（第 12、13 章）。\r\n\r\n参考音频的 Mel 在实例上缓存：\r\n\r\n```python\r\n# indextts/infer.py:508\r\nif self.cache_cond_mel is None or self.cache_audio_prompt != audio_prompt:\r\n    ... 重新计算 ...\r\n```\r\n\r\n同一个音色连续生成时，省掉读文件和计算 Mel。这个实例级缓存也是原版推理不能多线程并发调用的原因之一（第 04 章）。\r\n\r\n## 一次合成的形状\r\n\r\n```fig-tensor\r\n```\r\n\r\n| 阶段 | 形状 | 说明 |\r\n|---|---|---|\r\n| 参考波形 | `[1, N]` | 单声道，24 kHz |\r\n| `cond_mel` | `[1, 100, T]` | 100 个频带，T 帧，每帧约 10.7 ms |\r\n| `cond_latent` | `[1, 32, 1280]` | 32 个音色向量，与参考音频长短无关 |\r\n| `text_ids` | `[1, L]` | 一句话的文本 token |\r\n| `codes` | `[1, M]` | M 个声学码 |\r\n| `latent` | `[1, M, 1280]` | 每个码一个连续向量 |\r\n| `wav` | `[1, M × 1024]` | 24 kHz 单声道波形 |\r\n\r\n两个常数：\r\n\r\n- 采样率 **24000 Hz**。\r\n- 1 个声学码 = **1024 个采样点** = 42.7 毫秒，即每秒约 23.4 个码。\r\n\r\n默认 `max_mel_tokens=600` 时，单句最长约 600 × 42.7 ms ≈ 25.6 秒。超过就被截断，日志里会有警告。\r\n\r\n## 计时与 RTF\r\n\r\n`infer` 结束时打印三段耗时：`gpt_gen_time`（自回归生成）、`gpt_forward_time`（第二次前向）、`bigvgan_time`（声码器），以及 **RTF**（real-time factor）：总耗时除以生成音频的时长。RTF 小于 1 表示比实时快。\r\n\r\n自回归生成每个码都要一次前向，第二遍前向和 BigVGAN 对整句只算一次。`fast` 和 `batch` 改变的都是生成阶段的执行方式。\r\n\r\n## 本章对应文件\r\n\r\n- `indextts/infer.py:27` — 构造 GPT、BigVGAN、文本前端\r\n- `indextts/infer.py:500` — `infer` 主流程\r\n- `indextts/gpt/model.py:388` — HF 生成包装\r\n- `checkpoints/config.yaml` — 全部结构参数\r\n',frontend:'GPT 有两个输入：参考音频提供音色，文本提供内容。本章介绍二者进入模型前的预处理：音频转换为 Mel 频谱，文本转换为 token 并切分为句子。这些步骤在模型之外完成，但决定了 GPT 每次的输入内容与长度。\r\n\r\n参考音频的路径来自 `audio.path(audio_id)`（第 03 章），可能是 `data/` 里的上传文件，也可能是 `samples/` 里的原文件。格式可以是 WAV、MP3、FLAC 等，`torchaudio.load` 都能读。\r\n\r\n## 读取、单声道、重采样\r\n\r\n```python\r\n# indextts/infer.py:297\r\naudio, sr = torchaudio.load(audio_prompt)\r\naudio = torch.mean(audio, dim=0, keepdim=True)\r\naudio = torchaudio.transforms.Resample(sr, 24000)(audio)\r\ncond_mel = MelSpectrogramFeatures()(audio).to(self.device)\r\n```\r\n\r\n三行代码对应三个动作：\r\n\r\n1. `torchaudio.load` 返回 `[channels, samples]` 和采样率。\r\n2. `torch.mean(audio, dim=0, keepdim=True)` 在通道维求平均，立体声变成单声道，形状 `[1, N]`。\r\n3. 重采样到 24 kHz。模型只认识这个采样率。\r\n\r\n后面的 `if audio.shape[0] > 1` 实际上永远不会成立，因为上一步已经把通道数压成 1。这行是从旧代码留下来的防御性判断。\r\n\r\n## Mel 频谱的计算\r\n\r\n`MelSpectrogramFeatures` 封装了 torchaudio 的 `MelSpectrogram`（`utils/feature_extractors.py:24`），参数来自 `config.yaml`：\r\n\r\n| 参数 | 值 | 含义 |\r\n|---|---|---|\r\n| `sample_rate` | 24000 | 采样率 |\r\n| `n_fft` | 1024 | 每帧做 1024 点 FFT |\r\n| `hop_length` | 256 | 帧移 |\r\n| `win_length` | 1024 | 窗长 |\r\n| `n_mels` | 100 | 输出频带数 |\r\n| `power` | 1 | 取幅度谱，不取功率谱 |\r\n\r\n计算过程：\r\n\r\n```\r\n波形 [1, N]\r\n  │ 分帧：每 1024 个采样点一帧，相邻帧起点相隔 256\r\n  ▼\r\n帧矩阵 [frames, 1024]\r\n  │ 加窗 + FFT\r\n  ▼\r\n幅度谱 [frames, 513]\r\n  │ 乘 Mel 滤波器矩阵 [513, 100]\r\n  ▼\r\nMel 频谱 [frames, 100]\r\n  │ safe_log\r\n  ▼\r\nlog-mel [1, 100, frames]\r\n```\r\n\r\n`n_fft=1024` 产生 513 个非冗余频点，覆盖 0 到 12000 Hz，每个频点宽 23.44 Hz。Mel 滤波器把这 513 个线性频点压成 100 个频带。\r\n\r\n### 帧数的计算\r\n\r\n帧移 256 个采样点，1 秒有 24000 个采样点：\r\n\r\n```\r\n24000 / 256 = 93.75 帧/秒\r\n```\r\n\r\n每一帧代表约 **10.67 毫秒** 的音频。`center=True` 会在两端补零，所以帧数是：\r\n\r\n```\r\nT = 1 + floor(N / 256)\r\n```\r\n\r\n10 秒的参考音频，N = 240000，T ≈ 938 帧。\r\n\r\n### Mel 滤波器矩阵\r\n\r\nMel 刻度在低频更密、高频更疏。滤波器组是一张 `[513, 100]` 的权重矩阵，每个输出频带对应一组三角形权重：\r\n\r\n```\r\nmel[f, m] = Σ_k  spec[f, k] × weights[k, m]\r\n```\r\n\r\n它相当于对频率轴做一次非均匀重采样：低频保留更多分辨率，高频合并得更粗。矩阵的值由 `f_min`、`f_max`、`n_mels` 和 Mel 公式决定，训练时固定，不参与学习。\r\n\r\n`normalize: false` 表示不做面积归一化，三角形的高度按形状自然变化。\r\n\r\n### 取对数\r\n\r\n`safe_log` 对 Mel 频谱逐元素取自然对数，把动态范围压到网络容易处理的数量级。输出就是 `cond_mel`，形状 `[1, 100, T]`。\r\n\r\n最后一维 T 是帧数。代码里的 `cond_mel.shape[-1]` 会被包成 `cond_mel_lengths` 传给音色编码器，告诉它批里每条 Mel 有多少有效帧（第 09 章）。\r\n\r\n```fig-mel\r\n```\r\n\r\n## 42.7 毫秒与 23.4 个码\r\n\r\n`mel_length_compression = 1024` 是一个换算常数：\r\n\r\n```\r\n1 个声学码  ↔  1024 个采样点  ↔  4 个 Mel 帧\r\n```\r\n\r\n推导：\r\n\r\n- BigVGAN 的上采样乘积是 4×4×4×4×2×2 = 1024，所以 1 个隐向量产生 1024 个采样点。\r\n- Mel 的帧移是 256，所以 1024 个采样点等于 4 帧。\r\n- 1024 / 24000 = 0.04267 秒，即 42.7 毫秒。\r\n- 1 / 0.04267 = 23.4，即每秒约 23.4 个声学码。\r\n\r\n这个常数在代码里的用途是换算长度，不参与 Mel 提取：\r\n\r\n```python\r\n# indextts/infer.py:617\r\ncode_lens * self.gpt.mel_length_compression\r\n```\r\n\r\n`code_lens` 是生成的码数，乘 1024 得到对应的采样点数，作为 `wav_lengths` 传给 `forward`，用于计算 Mel 侧的填充长度。BigVGAN 自己按 `upsample_rates` 上采样，不读这个参数；Mel 提取用 `hop_length`，也不读它。\r\n\r\n所以它是一条「码 → 采样点」的桥，连接两个时间轴。\r\n\r\n## 参考音频的缓存\r\n\r\n原版推理在 `IndexTTS` 实例上缓存最近一次的 Mel（第 07 章）。连续批处理按 `(路径, 修改时间)` 缓存 Mel 和音色向量，最多 16 条（`batch.py:136`）：\r\n\r\n```python\r\nkey = (path, stat(path).st_mtime_ns)\r\n```\r\n\r\n文件被替换后修改时间变化，缓存自动失效。\r\n\r\n音频这一侧到此为止，接下来是文本。文本进入模型前要过三步：归一化、分词、分句。三步都在 CPU 上完成。\r\n\r\n\r\n## 归一化\r\n\r\n`TextNormalizer` 使用 `wetext` 的规则引擎，把书面文本改写成适合朗读的形式（`front.py:88`）：\r\n\r\n```python\r\n# indextts/utils/front.py:94\r\nfrom wetext import Normalizer\r\nself.zh_normalizer = Normalizer(remove_erhua=False, lang="zh", operator="tn")\r\nself.en_normalizer = Normalizer(lang="en", operator="tn")\r\n```\r\n\r\n`tn` 是 text normalization。中文分支处理数字、日期、单位、金额等写法，英文分支展开缩写。除此之外还有几层项目自己的处理：\r\n\r\n- `嗯` 替换成 `恩`，`呣` 替换成 `母`，避免语气词被读成别的音。\r\n- 英文缩写 `it\'s` 展开成 `it is`。\r\n- 拼音声调先替换成占位符 `<pinyin_a>`，归一化完再还原，防止 `xuan4` 被规则引擎改写。\r\n- 人名用占位符保护，归一化后原样放回。\r\n- 标点统一：全角逗号、句号、引号、括号都映射成 ASCII 标点（`front.py:15`）。\r\n\r\n归一化的结果是纯文本，仍然没有 token。\r\n\r\n## 分词\r\n\r\n`TextTokenizer` 用 SentencePiece 的 BPE 模型，词表 12000（`bpe.model`）。分词前有一个预处理器：\r\n\r\n```python\r\n# indextts/utils/front.py:232\r\nself.pre_tokenizers = [tokenize_by_CJK_char]\r\n```\r\n\r\n`tokenize_by_CJK_char` 在每个中日韩字符两侧插入空格，让 SentencePiece 把每个汉字当成独立的切分起点。英文仍然按 BPE 子词切分。\r\n\r\n```python\r\n# indextts/utils/front.py:300\r\ndef tokenize(self, text: str) -> List[str]:\r\n    return self.encode(text, out_type=str)\r\n\r\ndef encode(self, text, **kwargs):\r\n    if self.normalizer:\r\n        text = self.normalizer.normalize(text)\r\n    for pre_tokenizer in self.pre_tokenizers:\r\n        text = pre_tokenizer(text)\r\n    return self.sp_model.Encode(text, out_type=kwargs.pop("out_type", int), **kwargs)\r\n```\r\n\r\n调用链：\r\n\r\n```\r\n原文\r\n  │ normalize\r\n  ▼\r\n归一化文本\r\n  │ tokenize_by_CJK_char\r\n  ▼\r\n汉字之间带空格的文本\r\n  │ SentencePiece BPE\r\n  ▼\r\ntoken 列表，例如 ["你", "好", "▁world"]\r\n```\r\n\r\n`tokenize` 返回字符串列表，`convert_tokens_to_ids` 再把每个 token 换成 id。两个函数分开，是因为分句需要在字符串层面操作。\r\n\r\n注意 SentencePiece 做的是**子词切分**，不是中文分词：它不输出「词」的边界。中文经过 `tokenize_by_CJK_char` 预处理后基本按字切，英文按 BPE 子词切。这套流程里没有词级分词器，也不需要：模型训练时看到的就是这种切法。\r\n\r\n### 12000 个 token 的构成\r\n\r\n词表包含：\r\n\r\n- 常用汉字；\r\n- 英文 BPE 子词；\r\n- 拼音片段，用于 `xuan4` 这类显式注音；\r\n- 标点与特殊符号；\r\n- `<unk>`、`<s>`、`</s>` 等特殊 token。\r\n\r\n这是一张固定词表。训练时确定，推理时不能改变。输入里出现词表外的字符会落到 `<unk>`，所以归一化和字符映射的作用之一就是减少未知字符。\r\n\r\n## 分句\r\n\r\nGPT 每次处理一句话，整篇文章先要切开。分句由 `split_sentences` 完成（`front.py:412`）：\r\n\r\n```python\r\n# indextts/utils/front.py:403\r\npunctuation_marks_tokens = [".", "!", "?", "▁.", "▁?", "▁..."]\r\n\r\ndef split_sentences(self, tokenized, max_tokens_per_sentence=120):\r\n    return TextTokenizer.split_sentences_by_token(\r\n        tokenized, self.punctuation_marks_tokens,\r\n        max_tokens_per_sentence=max_tokens_per_sentence,\r\n    )\r\n```\r\n\r\n注意这里比较的是 **token**，不是字符。标点在分词后可能带下划线前缀（`▁.` 表示词首的点），所以列表里同时列出两种形式。\r\n\r\n`split_sentences_by_token` 的规则（`front.py:332`）：\r\n\r\n1. 逐 token 累积，遇到标点且当前句长度大于 2，就在标点后切开。\r\n2. 如果下一 token 是 `\'`，把它并入当前句，避免把 `don\'t` 拆开。\r\n3. 如果累积长度超过 `max_tokens_per_sentence`，先尝试按逗号切；没有逗号再按连字符切；都没有就按固定长度硬切。\r\n4. 切完之后，相邻两句如果加起来不超过上限，就合并回一句。\r\n\r\n最后一步很重要。按标点切出来的句子往往很短，合并可以减少 GPT 的调用次数。\r\n\r\n```python\r\n# 伪代码\r\nfor token in tokens:\r\n    current.append(token)\r\n    if token in punctuation and len(current) > 2:\r\n        sentences.append(current); current = []\r\n    if len(current) > max_tokens:\r\n        split_at_comma_or_hyphen_or_fixed()\r\nmerge_adjacent_if_fits()\r\n```\r\n\r\n上限由调用方传入：\r\n\r\n| 调用 | 默认上限 |\r\n|---|---|\r\n| `IndexTTS.infer` | 120 |\r\n| `IndexTTS.infer_fast` | 100 |\r\n\r\n上限越小，句子越短，批处理的粒度越细，速度更快，但上下文被切得更碎；上限越大，单句越完整，生成时间更长。\r\n\r\n## 推理里的文本处理\r\n\r\n`infer` 的文本阶段只有几行（`infer.py:528`）：\r\n\r\n```python\r\ntext_tokens_list = self.tokenizer.tokenize(text)\r\nsentences = self.tokenizer.split_sentences(text_tokens_list, max_text_tokens_per_sentence)\r\nfor sent in sentences:\r\n    text_tokens = self.tokenizer.convert_tokens_to_ids(sent)\r\n    text_tokens = torch.tensor(text_tokens, dtype=torch.int32, device=self.device).unsqueeze(0)\r\n```\r\n\r\n得到的是一个 `[1, L]` 的整型张量。`start_text` 和 `stop_text` 不在这里添加，由 GPT 的 `prepare_gpt_inputs` 统一补。\r\n\r\n`infer_fast` 多做一步分桶：先得到所有句子，再按长度重新排列（第 12 章）。连续批处理在 `Scheduler.submit` 里用同样的 `tokenize` + `split_sentences` 切句（第 13 章）。\r\n\r\n## 本章对应文件\r\n\r\n- `indextts/infer.py:296-315` — 读取参考音频、计算 Mel\r\n- `indextts/utils/feature_extractors.py:24` — Mel 参数\r\n- `indextts/batch.py:136` — 批处理的条件缓存\r\n- `indextts/utils/front.py:11` — 归一化规则\r\n- `indextts/utils/front.py:218` — 分词器\r\n- `indextts/utils/front.py:332` — 分句算法\r\n- `indextts/infer.py:528` — 推理中的文本处理\r\n- `checkpoints/config.yaml` — `dataset.mel` 段\r\n- `checkpoints/bpe.model` — 12000 词表\r\n',conditioning:'`cond_mel` 是一张 `[1, 100, T]` 的 Mel 频谱图，T 可能几百到几千帧。GPT 需要的却是一个长度固定的前缀。中间这段压缩由 `UnifiedVoice` 里的条件编码器完成。\r\n\r\n条件编码器分两段：\r\n\r\n- **Conformer**：注意力加卷积的编码器，常用于语音识别。它逐帧读 Mel，输出同样长度、但每帧含义更丰富的特征序列。\r\n- **Perceiver**：用固定数量的「查询向量」去读一段变长序列，输出固定长度的结果。这里固定为 32 个。\r\n\r\n所以不管参考音频是 3 秒还是 60 秒，GPT 看到的音色前缀都是 32 个 1280 维向量。\r\n\r\n## 三个调用点\r\n\r\n`UnifiedVoice` 只有一个实例，就是 `IndexTTS.gpt`（`infer.py:74`）。推理期间从三个地方进入它：\r\n\r\n| 位置 | 调用 | 用途 |\r\n|---|---|---|\r\n| `infer.py:385` / `:573` | `inference_speech` | 生成声学码，内部先调用 `get_conditioning` |\r\n| `infer.py:431` / `:615` | `forward(..., return_latent=True)` | 第二遍前向，码 → 隐向量 |\r\n| `batch.py:146` | `get_conditioning` | 批处理路径单独取音色 latent |\r\n\r\n`forward` 在训练时返回两个交叉熵损失，推理时只取隐状态，损失计算不会执行。`text_head` 也因此闲置。\r\n\r\n## Conformer：变长的 Mel 序列\r\n\r\n`condition_type="conformer_perceiver"` 时，构造函数创建两个模块（`model.py:347`）：\r\n\r\n```python\r\n# indextts/gpt/model.py:348\r\nself.conditioning_encoder = ConformerEncoder(\r\n    input_size=100,\r\n    output_size=512,\r\n    linear_units=2048,\r\n    attention_heads=8,\r\n    num_blocks=6,\r\n    input_layer="conv2d2",\r\n)\r\nself.perceiver_encoder = PerceiverResampler(\r\n    model_dim=1280,\r\n    dim_context=512,\r\n    ff_mult=2,\r\n    heads=8,\r\n    num_latents=32,\r\n)\r\n```\r\n\r\n数据流：\r\n\r\n```\r\ncond_mel [1, 100, T]\r\n  │ transpose → [1, T, 100]\r\n  ▼\r\nConformerEncoder\r\n  │ conv2d2 先做 2 倍下采样\r\n  ▼\r\n[1, T/2, 512] + padding mask\r\n  │ Perceiver 的 32 个查询槽\r\n  ▼\r\ncond_latent [1, 32, 1280]\r\n```\r\n\r\n`conv2d2` 表示输入先过一个 stride=2 的二维卷积（`conformer/subsampling.py`）。时间维减半，随后 6 层 Conformer 在更短的序列上做注意力，计算量下降。\r\n\r\n### 维度交换的原因\r\n\r\nMel 频谱的自然布局是「通道在前」：`[batch, n_mels, frames]`，因为它是频谱图。Conformer 的接口是「时间在前」：`[batch, time, dim]`，因为注意力、FFN、LayerNorm 都按最后一维组织。\r\n\r\n两套布局的约定不同，入口处必须换一次：\r\n\r\n```python\r\n# indextts/gpt/model.py:497\r\nspeech_conditioning_input.transpose(1, 2)   # [B,100,T] → [B,T,100]\r\n```\r\n\r\n卷积模块内部还有第二次交换：\r\n\r\n```python\r\n# indextts/gpt/conformer_encoder.py:130\r\nx = x.transpose(1, 2)   # [B,T,C] → [B,C,T]\r\n```\r\n\r\nPyTorch 的 `nn.Conv1d` 要求输入是 `(N, C, L)`，通道维在第 1 位，卷积核沿第 2 维滑动。Conformer 内部一直是 `[B, T, C]`，只有进卷积时才切换。\r\n\r\n方向不能反。卷积核必须沿时间滑，通道是每个时刻的特征。如果保持 `[B, T, C]`，卷积会在特征维上滑动，`groups=channels` 的深度卷积分组也会失去意义。\r\n\r\n模块内部还有一对往返：\r\n\r\n```python\r\nx = self.depthwise_conv(x)      # [B,C,T]\r\nx = x.transpose(1, 2)           # [B,T,C]\r\nx = self.activation(self.norm(x))   # LayerNorm 作用于最后一维\r\nx = x.transpose(1, 2)           # 回到 [B,C,T]\r\nx = self.pointwise_conv2(x)\r\n```\r\n\r\n`transpose` 只改 stride，不搬数据，开销很小。\r\n\r\n```fig-conformer\r\n```\r\n\r\n### 卷积模块的计算\r\n\r\nConformer 一层有四个子模块：\r\n\r\n```\r\nx = x + FFN_half(x)     # 逐位置\r\nx = x + MHSA(x)         # 全局注意力\r\nx = x + ConvModule(x)   # 局部卷积\r\nx = x + FFN_half(x)     # 逐位置\r\n```\r\n\r\n注意力对每个位置一视同仁，没有「邻近帧更相似」的先验。卷积的滑动窗口直接把这个先验写进结构。\r\n\r\n卷积模块内部：\r\n\r\n```\r\npointwise_conv1 (1×1)   100 → 512，再扩成 1024\r\nGLU                     门控，选通道\r\ndepthwise_conv (k=15)   每个通道沿时间独立卷积\r\nLayerNorm + SiLU\r\npointwise_conv2 (1×1)   再混合通道\r\n```\r\n\r\n`k=15` 作用在下采样后的时间轴上：\r\n\r\n- 原始 Mel 帧：256 / 24000 ≈ 10.7 ms\r\n- 下采样 2 倍后：约 21.3 ms\r\n- 15 帧 ≈ 320 ms\r\n\r\n6 层堆叠，感受野线性增长到约 1.8 秒，覆盖音节和短句的韵律单元。\r\n\r\n`depthwise` 的参数量是 `512 × 15 ≈ 7.7k`，普通卷积要 `512 × 512 × 15 ≈ 3.9M`。每个通道学一条时间滤波器，合起来相当于一组可学习的带通滤波器。\r\n\r\n这里的卷积使用对称填充（`padding=(k-1)//2`，`lorder=0`），可以同时看过去和未来。参考音频已经录好，不需要因果约束。\r\n\r\n## Perceiver：把 T 压成 32\r\n\r\nPerceiverResampler 的核心是 32 个可学习的查询向量（`perceiver.py:224`）：\r\n\r\n```python\r\nself.latents = nn.Parameter(torch.randn(32, 1280))\r\n\r\nfor _ in range(depth):                       # 默认 2 层\r\n    latents = attn(latents, x, mask=mask) + latents\r\n    latents = ff(latents) + latents\r\n\r\nreturn RMSNorm(latents)\r\n```\r\n\r\n形状变化：\r\n\r\n```\r\ncontext  [B, T, 512]  → Linear → [B, T, 1280]\r\nlatents  [32, 1280]   → repeat → [B, 32, 1280]\r\n                        │\r\n                        │  Q = latents, K/V = context\r\n                        ▼\r\noutput   [B, 32, 1280]\r\n```\r\n\r\nT 在输出里消失了。参考音频 3 秒还是 60 秒，都输出 32 个向量。\r\n\r\n这一步有三个作用：\r\n\r\n1. **定长前缀。** GPT 的序列长度可控，不会随参考音频增长。\r\n2. **成本固定。** 24 层 GPT 每一步都要对前缀做注意力，32 个 token 的成本与参考长度无关。`batch.py` 还把结果按文件缓存，同一音色只算一次。\r\n3. **信息瓶颈。** 32 个向量装不下整段语音，网络必须挑出与音色相关的成分，减少把参考音频内容带进输出的可能。\r\n\r\n查询槽是参数，训练后自然分工：有的关注低频共振峰，有的关注气声比例。注意力矩阵是 `32 × (32 + T)`，与 T 线性相关，比 6 层 Conformer 便宜。\r\n\r\n两个实现细节：\r\n\r\n- `cross_attn_include_queries=True` 把查询槽拼进 K/V，一次注意力同时完成「读输入」和「槽间交换」。\r\n- padding 帧用 mask 屏蔽。`cond_mask_pad` 在 mask 左侧补 32 个 `True`，对应查询槽自身。\r\n\r\n```fig-perceiver\r\n```\r\n\r\n## condition type 的四个分支\r\n\r\n`condition_type` 是构造开关，决定 Mel 转换为前缀的方式。代码里有四条路径：\r\n\r\n| 类型 | 编码器 | 输出 | 状态 |\r\n|---|---|---|---|\r\n| `default` | `ConditioningEncoder(mean=True)` | `[B, 1, 1280]` | 可用，整段平均成一个向量 |\r\n| `perceiver` | `ConditioningEncoder` + Perceiver | `[B, 32, 1280]` | 可用，构造函数默认 |\r\n| `conformer_perceiver` | Conformer + Perceiver | `[B, 32, 1280]` | 本项目使用 |\r\n| `gst` | `gst_encoder` | — | 死分支，属性从未定义 |\r\n| `conformer_encoder` | Conformer，无 Perceiver | — | 半成品，`get_conditioning` 无对应分支 |\r\n\r\n前两条是 1 个向量，后两条是 32 个。这个数字会一路传下去：`prepare_gpt_inputs` 用 `target_len = cond_len + L + 2` 拼序列，`get_logits` 用 `offset = cond_len` 切出文本部分。\r\n\r\n保留开关的原因是：模型结构必须与训练时的配置一致，`load_state_dict(strict=True)` 才能通过。IndexTTS 的条件编码器换过几代，同一份代码要能加载旧权重。`gst` 和 `conformer_encoder` 是从上游继承的残留，无法运行。\r\n\r\n本项目只会执行 `conformer_perceiver`。读代码时可以把另外几条分支跳过。\r\n\r\n## 本章对应文件\r\n\r\n- `indextts/gpt/model.py:344` — 条件编码器构造\r\n- `indextts/gpt/model.py:490` — `get_conditioning`\r\n- `indextts/gpt/conformer_encoder.py:56` — 卷积模块\r\n- `indextts/gpt/perceiver.py:224` — PerceiverResampler\r\n- `indextts/batch.py:136` — 批处理的条件缓存\r\n',gpt:"GPT 的任务是把「文本 + 音色」变成一串离散声学码。这一章拆开 `inference_speech`（`gpt/model.py:655`），介绍输入序列的拼接、token 的采样与停止条件。\r\n\r\n## 提示序列\r\n\r\nGPT 的输入由三段拼成：\r\n\r\n```fig-prompt\r\n```\r\n\r\n具体顺序（`prepare_gpt_inputs`，`model.py:591`）：\r\n\r\n```\r\n[32 个 cond latent][start_text][文本 token × L][stop_text][start_mel]\r\n```\r\n\r\n对应代码：\r\n\r\n```python\r\n# indextts/gpt/model.py:616\r\nvalid_mask = (text_inputs[i] != self.stop_text_token) & (text_inputs[i] != self.start_text_token)\r\ntext_input = text_inputs[i][valid_mask]\r\ntext_input = F.pad(text_input, (1, 0), value=self.start_text_token)\r\ntext_input = F.pad(text_input, (0, 1), value=self.stop_text_token)\r\ntext_emb = self.text_embedding(text_input) + self.text_pos_embedding.emb(text_input_pos)\r\nconds_text_emb = [conditional_latents[i], text_emb]\r\n```\r\n\r\n文本张量里可能带有调用方补的填充 token，这里先把 `start_text` 和 `stop_text` 过滤掉，再重新包一对边界。然后与 32 个条件向量拼接。\r\n\r\n如果文本比同批其他句子短，会在**左侧**补零向量，同时把 attention mask 的对应位置设为 0：\r\n\r\n```python\r\npadding = L + 2 - text_input.size(-1)\r\nif padding > 0:\r\n    pad = torch.zeros((padding, 1280))\r\n    conds_text_emb.insert(0, pad)\r\n    attention_mask[:padding] = 0\r\n```\r\n\r\n左填充的设计让所有序列的最后一个位置都对齐，方便批量取 logits。\r\n\r\n最后再拼一个 `start_mel`（id 8192），作为生成的起点。`fake_inputs` 里除了这个起点，其他位置填 1，只是占位，真正的输入是 `inputs_embeds`。\r\n\r\n## 位置编码：固定表，逐元素相加\r\n\r\n> **记忆提醒**：token 向量和位置向量逐元素相加，1280 维仍是 1280 维。`torch.cat` 只用于沿序列维拼接条件、文本和 `start_mel`，位置向量不会被接到 token 向量后面。\r\n\r\n构建 GPT 主干时，先移除 HF GPT-2 自带的绝对位置编码 `wpe`，换成全零函数：\r\n\r\n```python\r\n# indextts/gpt/model.py:269\r\ndel gpt.wpe\r\ngpt.wpe = functools.partial(null_position_embeddings, dim=model_dim)\r\n```\r\n\r\n位置信息改由两张独立的位置表提供：\r\n\r\n- `text_pos_embedding`：文本侧，从 0 开始编号；\r\n- `mel_pos_embedding`：声学码侧，从 0 开始编号。\r\n\r\n先界定“文本段”。完整 GPT 输入由三部分组成：\r\n\r\n```text\r\n[32 个 cond latent] [start_text] + [BPE 文本 token] + [stop_text] [start_mel]\r\n                     └────────────── 文本段 ──────────────┘\r\n```\r\n\r\n只有中间这段使用 `text_pos_embedding`。条件 latent 不占文本位置号；`start_mel` 与后续声学码走 `mel_pos_embedding`。\r\n\r\n正常推理不会把一篇长文直接送进 GPT。原文先做归一化，再 BPE 分词，最后由 `split_sentences` 切成多个句子：\r\n\r\n- 普通模式：`infer` 默认每个句子最多 120 个文本 token；\r\n- `fast` 模式：`infer_fast` 默认每个句子最多 100 个文本 token；\r\n- 一篇长文会拆成多次独立生成。\r\n\r\n句子过长且没有可切分标点时，分词器会按长度强切，并发出 token 超限警告。602 是模型的硬上限：600 个文本 token 加 `start_text`、`stop_text`。正常的分句逻辑会把输入压在远低于 602 的位置。只有绕过分句，或手动把 `max_text_tokens_per_sentence` 设得很大，才可能让文本段超过表长；模型不会动态扩容，PyTorch 的 embedding 会直接越界报错。\r\n\r\n`LearnedPositionEmbeddings` 按位置查一张固定表，表内容不受 token 文本影响。v1.5 的文本表是 `[602, 1280]`。运行时：\r\n\r\n```python\r\ntorch.arange(0, L)          # [0, 1, ..., L-1]\r\nself.emb(torch.arange(...)) # [L, 1280]\r\n```\r\n\r\n得到的位置行通过广播加到 `[B, L, 1280]` 的文本 embedding：\r\n\r\n```python\r\ntext_emb = self.text_embedding(text_inputs) + self.text_pos_embedding(text_inputs)\r\n```\r\n\r\n完整输入随后沿序列维拼接：\r\n\r\n```python\r\nemb = torch.cat([speech_conditioning_inputs, first_inputs], dim=1)\r\n```\r\n\r\n```fig-position\r\n```\r\n\r\n```fig-position-concat\r\n```\r\n\r\n两图对应两步：前者说明固定表按 `arange(0, L)` 取前 `L` 行，后者说明逐元素相加后沿序列维拼接为 GPT 输入。\r\n\r\n变长文本放进同一批时，短句在左侧补零向量，attention mask 对应位置设为 0。这些补出来的位置不分配文本位置号，每句的 `start_text` 都是位置 0。\r\n\r\nMel 侧使用同一套约定：`mel_pos_embedding` 是固定表，运行时按声学码长度取前 M 行。`batch.py` 里一行声学码的位置是 `len(row.codes) + 1`。\r\n\r\n## 生成调用\r\n\r\n拼好输入后，交给 HF 的 `generate`：\r\n\r\n```python\r\n# indextts/gpt/model.py:697\r\nmax_length = (trunc_index + self.max_mel_tokens - 1) if max_generate_length is None else trunc_index + max_generate_length\r\noutput = self.inference_model.generate(\r\n    inputs,\r\n    bos_token_id=self.start_mel_token,\r\n    pad_token_id=self.stop_mel_token,\r\n    eos_token_id=self.stop_mel_token,\r\n    attention_mask=attention_mask,\r\n    max_length=max_length,\r\n    logits_processor=logits_processor,\r\n    num_return_sequences=num_return_sequences,\r\n    **hf_generate_kwargs,\r\n)\r\nreturn output[:, trunc_index:]\r\n```\r\n\r\n`trunc_index` 是提示长度。返回值切掉提示部分，只留下新生成的码。\r\n\r\n### 词表\r\n\r\n`number_mel_codes = 8194`：\r\n\r\n| 范围 | 含义 |\r\n|---|---|\r\n| 0 – 8191 | 声学码 |\r\n| 8192 | `start_mel`，生成起点 |\r\n| 8193 | `stop_mel`，停止符 |\r\n\r\n`mel_head` 输出 8194 维 logits，每一步取一个 id。`stop_mel` 被同时用作 `eos_token_id` 和 `pad_token_id`，所以生成到它会自动结束。\r\n\r\n### 生成长度\r\n\r\n`max_generate_length` 由调用方传入，默认 600。`generate` 的 `max_length` 等于提示长度加 600，也就是最多生成 600 个新码。\r\n\r\n每个声学码对应 `mel_length_compression = 1024` 个采样点，采样率 24 kHz，所以 600 个码理论上最长：\r\n\r\n```text\r\n600 × 1024 / 24000 = 25.6 秒\r\n```\r\n\r\n如果把生成上限抬到配置里的 `max_mel_tokens = 800`，理论上限是 `800 × 1024 / 24000 ≈ 34.1 秒`。`remove_long_silence` 会在生成后压缩连续静音，成品时长可能短于这个上限。\r\n\r\n如果 600 个码用完还没出现停止符，代码会发出警告（`infer.py:409`），提示要么减小每句 token 数，要么增大 `max_mel_tokens`。\r\n\r\n## 采样参数\r\n\r\n`infer` 从 `generation_kwargs` 里取出这些参数：\r\n\r\n| 参数 | 默认 | 作用 |\r\n|---|---|---|\r\n| `do_sample` | `True` | 采样还是贪心 |\r\n| `top_p` | 0.8 | 核采样阈值 |\r\n| `top_k` | 30 | 只保留概率最高的 k 个 |\r\n| `temperature` | 1.0 | 温度，越低越保守 |\r\n| `num_beams` | 3 | beam 数量 |\r\n| `length_penalty` | 0.0 | beam 打分的长度惩罚 |\r\n| `repetition_penalty` | 10.0 | 已出现 token 的惩罚 |\r\n| `max_mel_tokens` | 600 | 单句最大码数 |\r\n\r\n`do_sample` 与 `num_beams` 的组合值得说清楚。transformers 的选择逻辑是：\r\n\r\n- `do_sample=False`、`num_beams=1` → 贪心；\r\n- `do_sample=False`、`num_beams>1` → beam search；\r\n- `do_sample=True`、`num_beams=1` → 多项式采样；\r\n- `do_sample=True`、`num_beams>1` → **beam sampling**，每条 beam 内部采样，再按总分保留。\r\n\r\n项目默认 `do_sample=True`、`num_beams=3`，所以走的是 beam sampling，不是纯 beam search。想要确定性输出，把 `do_sample` 设为 `False`。\r\n\r\n`repetition_penalty=10` 偏高，作用是压制重复的声学码，减少结巴和循环。温度设为 0 或极低值时，采样会退化成近似贪心。\r\n\r\n## autoregressive_batch_size 固定为 1 的原因\r\n\r\n`infer` 里有一行：\r\n\r\n```python\r\nautoregressive_batch_size = 1\r\n```\r\n\r\n它一路传到 `num_return_sequences`。HF 的 `generate` 支持一次返回多条完整序列，但后续代码没有做选择：\r\n\r\n- `codes` 会变成 `[N, M]`；\r\n- 第二遍前向的 `text_tokens` 仍是 `[1, L]`，批大小对不上；\r\n- `remove_long_silence` 与 `BigVGAN` 也按单条处理。\r\n\r\n所以这里固定为 1。需要多条候选时，走 `batch.py` 的 best-of-N 路径：N 条独立采样，取平均 log 概率最高的一条。`num_return_sequences` 只是 HF 接口提供的可能性，项目没有使用。\r\n\r\n## 停止与静音修剪\r\n\r\n生成结束后还有一步后处理：\r\n\r\n```python\r\n# indextts/infer.py:605\r\ncodes, code_lens = self.remove_long_silence(codes, silent_token=52, max_consecutive=30)\r\n```\r\n\r\n`silent_token=52` 是训练时定义的静音码。如果一条序列里静音码超过 30 个，`remove_long_silence` 会把每一段连续静音压缩到最多 10 个，并截掉停止符之后的内容。\r\n\r\n这样做的原因是采样偶尔会生成异常长的停顿，听感上像是卡顿。修剪只改静音段，不改正常语音。\r\n\r\n## 本章对应文件\r\n\r\n- `indextts/gpt/model.py:591` — 拼提示序列\r\n- `indextts/gpt/model.py:655` — `inference_speech`\r\n- `indextts/gpt/model.py:40` — `GPT2InferenceModel`\r\n- `indextts/infer.py:573` — 普通模式的生成调用\r\n- `indextts/infer.py:605` — 静音修剪\r\n",vocoder:`声学码是离散的整数，声码器需要连续的向量。中间这一步由 GPT 再做一次前向完成。\r
\r
## 第二遍前向\r
\r
生成结束后，\`infer\` 立刻用完整的码序列再算一次：\r
\r
\`\`\`python\r
# indextts/infer.py:614\r
latent = self.gpt(\r
    auto_conditioning, text_tokens,\r
    torch.tensor([text_tokens.shape[-1]], device=...),\r
    codes,\r
    code_lens * self.gpt.mel_length_compression,\r
    cond_mel_lengths=torch.tensor([auto_conditioning.shape[-1]], device=...),\r
    return_latent=True, clip_inputs=False,\r
)\r
\`\`\`\r
\r
参数依次是：\r
\r
| 参数 | 值 | 含义 |\r
|---|---|---|\r
| \`speech_conditioning_latent\` | \`cond_mel\` | 参考音频的 Mel |\r
| \`text_inputs\` | \`[1, L]\` | 文本 token |\r
| \`text_lengths\` | \`[1]\` | 文本长度 |\r
| \`mel_codes\` | \`[1, M]\` | 生成的声学码 |\r
| \`wav_lengths\` | \`code_lens × 1024\` | 对应的采样点数 |\r
| \`cond_mel_lengths\` | \`[1]\` | 参考 Mel 的帧数 |\r
| \`return_latent\` | \`True\` | 只要隐状态，不算损失 |\r
\r
\`forward\` 内部把条件、文本、码分别嵌入，拼成一条序列，经过 24 层 Transformer，然后从 Mel 位置切出隐状态（\`model.py:576\`）：\r
\r
\`\`\`python\r
text_logits, mel_logits = self.get_logits(conds, text_emb, self.text_head, mel_emb, self.mel_head, return_latent=True)\r
return mel_logits[:, :-2]\r
\`\`\`\r
\r
返回的 \`latent\` 形状是 \`[1, M, 1280]\`。每个声学码对应一个 1280 维向量。\r
\r
### 第二遍前向的必要性\r
\r
第一遍是自回归生成：每次只前向一个新 token，取最后一个位置的 logits，采样出码。它只决定下一个码，不保留完整的声学表示。\r
\r
第二遍把整串码一次性输入，利用每个位置之前的所有码，输出每个位置的高维隐状态。因果掩码仍在，位置 i 只能看到 0 到 i 的码。这个隐状态比离散码包含更多细节，适合作为声码器的输入。\r
\r
它不是自回归循环：一次性算完，没有采样，也没有 KV cache。\`return_latent=True\` 让 \`forward\` 跳过两个交叉熵损失，只返回隐状态。\r
\r
序列首尾各有一个边界 token 由 \`forward\` 自动添加，输出时切掉，所以长度正好等于码数 M。\r
\r
## BigVGAN\r
\r
声码器的入口在 \`BigVGAN/models.py:201\`：\r
\r
\`\`\`python\r
# indextts/infer.py:623\r
wav, _ = self.bigvgan(latent, auto_conditioning.transpose(1, 2))\r
wav = wav.squeeze(1)\r
\`\`\`\r
\r
第二个参数是 \`[1, T, 100]\` 的参考 Mel。BigVGAN 内部先过 ECAPA 说话人编码器，得到一个 512 维向量：\r
\r
\`\`\`python\r
# indextts/BigVGAN/models.py:191\r
self.speaker_encoder = ECAPA_TDNN(100, lin_neurons=512)\r
\`\`\`\r
\r
这个向量在每个上采样层用 1×1 卷积投到当前通道数，然后与特征相加。参考音频因此第二次参与生成：第一次影响 GPT 的音色 latent，第二次影响声码器的音色。\r
\r
主干的形状变化：\r
\r
\`\`\`\r
latent [1, M, 1280]\r
  │ transpose → [1, 1280, M]\r
  ▼\r
conv_pre: 1280 → 1536\r
  │ + speaker_embedding\r
  ▼\r
上采样 4× → +speaker → 3 个 AMPBlock 取平均\r
上采样 4× → +speaker → 3 个 AMPBlock 取平均\r
上采样 4× → +speaker → 3 个 AMPBlock 取平均\r
上采样 4× → +speaker → 3 个 AMPBlock 取平均\r
上采样 2× → +speaker → 3 个 AMPBlock 取平均\r
上采样 2× → +speaker → 3 个 AMPBlock 取平均\r
  ▼\r
snakebeta 激活 → conv_post → tanh\r
  ▼\r
wav [1, 1, M × 1024]\r
\`\`\`\r
\r
几个细节：\r
\r
- 通道数从 1536 开始，每级减半。\r
- 每级有 3 个残差块，卷积核分别是 3、7、11，输出取平均。\r
- \`snakebeta\` 是周期激活函数，适合建模音频的周期性。\r
- 最后用 \`tanh\` 把输出压到 \`[-1, 1]\`。\r
\r
上采样乘积 1024 与 GPT 的 \`mel_length_compression\` 对齐，所以 M 个码正好产生 M×1024 个采样点。\r

`,buckets:`\`fast\` 模式（网页上的「批次推理」，\`IndexTTS.infer_fast\`）把一段文本切出的多个句子按长度分组，同组的句子放进一个 batch 一起生成。本章介绍分组算法、顺序还原，以及同组句子互不影响的原因。\r
\r
## fast 的完整流程\r
\r
\`infer_fast\`（\`infer.py:278\`）与原版共享前半段：读参考音频、算 Mel、分词、分句。之后分叉：\r
\r
1. 把所有句子按长度分桶（\`bucket_sentences\`）。\r
2. 每个桶内的句子拼成一个 batch，一次 \`inference_speech\` 生成。\r
3. 对每个码序列做第二遍前向，得到 latent。\r
4. 按原始顺序排列 latent。\r
5. 每 2 条 latent 拼在一起，过一次 BigVGAN。\r
6. 所有波形按顺序拼接，保存。\r
\r
桶之间是串行的：桶 1 生成完，再生成桶 2。桶内是并行的。\r
\r
## 分桶算法\r
\r
\`bucket_sentences\`（\`infer.py:188\`）接收句子列表，每个元素带原始下标：\r
\r
\`\`\`python\r
outputs.append({"idx": idx, "sent": sent, "len": len(sent)})\r
\`\`\`\r
\r
如果句子数不超过 \`bucket_max_size\`（默认 4），直接返回一个大桶。否则按长度排序，从上到下扫描：\r
\r
- 当前句长度达到上一个桶中位数的 1.5 倍，或桶已满，就开新桶；\r
- 否则放进当前桶。\r
\r
排序后长度接近的句子自然聚在一起。第一轮会产生一些只有一个句子的桶，代码再做一次合并：把单句桶并入尚有空位的桶，剩下的按 4 个一组打包。\r
\r
\`\`\`fig-buckets\r
\`\`\`\r
\r
参数的影响：\r
\r
- \`sentences_bucket_max_size\` 越大，桶越少，批越大，显存占用更高，速度更快。\r
- \`max_text_tokens_per_sentence\` 越小，句子越短，桶内长度更均匀，batch 更有效。\r
\r
CPU 上 \`bucket_max_size\` 被强制为 1，相当于退回逐句生成（\`infer.py:346\`）。\r
\r
## 顺序的还原\r
\r
每个句子都带着原始下标 \`idx\`。生成时按桶的顺序进行，latent 也按桶的顺序追加，同时记录下标的出现顺序：\r
\r
\`\`\`python\r
# indextts/infer.py:426\r
all_idxs.append(batch_sentences[i]["idx"])\r
\`\`\`\r
\r
全部生成完后，用一次重排把 latent 放回原始位置：\r
\r
\`\`\`python\r
# indextts/infer.py:441\r
all_latents = [all_latents[all_idxs.index(i)] for i in range(len(all_latents))]\r
\`\`\`\r
\r
\`all_idxs\` 是「生成顺序 → 原始下标」的映射。对每个原始下标 \`i\`，找到它在生成顺序里的位置，取出对应的 latent。输出音频因此和原文顺序一致。\r
\r
重排发生在生成完成之后，生成时每句仍然独立。\r
\r
## 批内的句子互不影响\r
\r
这是最容易误会的地方。批处理把几句话并排放在同一个 batch 里算，每句仍是独立的一条序列。\r
\r
Transformer 的 batch 维是独立的。\`[B, T, D]\` 里的 B 条序列各自做注意力，第 1 条看不到第 2 条的 token。KV cache 也按 batch 行分开存储。每个句子的自回归循环只依赖自己的提示和自己的历史码。\r
\r
具体到代码：\r
\r
- \`prepare_gpt_inputs\` 为每行单独拼 \`[cond][text][start_mel]\`，短句在左侧补零，mask 置 0。\r
- 生成时 \`num_beams\` 把每行扩展成多条 beam，\`_reorder_cache\` 只在行内重排。\r
- 第二遍前向按行独立计算，\`text_tokens\` 与 \`codes\` 一一对应。\r
\r
所以第 2 句不会因为和第 1 句同批而改变内容。唯一的共享是同一个 \`cond_latent\`，也就是同一个音色。\r
\r
分桶改变的只是执行顺序与批大小，每句的输入条件完全不变。\r
\r
## 分桶的收益与适用范围\r
\r
GPU 一次前向算 1 行和算 4 行的耗时差不多，瓶颈在读权重和启动 kernel。把长度接近的句子放在一起，填充浪费少，一次前向就推进了 4 句。\r
\r
但分桶只发生在**一次 \`infer_fast\` 调用的内部**：它只能把同一段文本切出来的句子放在一起。所以：\r
\r
- 单句生成一段长文、切出多个句子时，\`fast\` 能把多句放进同一批；\r
- 台本的每一句是一次独立调用，短句通常只切出一个句子，一个句子没法分桶，\`fast\` 和 \`normal\` 几乎一样；\r
- 要让不同调用的句子一起算，需要跨请求的调度，这就是下一章的连续批处理。\r
\r

`,batching:'`batch` 模式（网页上的「并发推理」）和外部 API 使用 `indextts/batch.py` 的连续批处理。它和 `fast` 想解决同一个问题，让 GPU 一次算多句，但做法完全不同。\r\n\r\n## 中心思想\r\n\r\n`fast` 的一个桶里的句子一起开始、一起结束：最长的那句没解完，已结束句子所在的行仍参与计算，造成浪费。此外，一个桶只能包含同一次调用的句子。\r\n\r\n连续批处理换了一个思路：批是一组**正在解码的行**，每一步都可以变化。\r\n\r\n- 新句子在任意两步之间加入；\r\n- 某一行采到停止符，下一步之前就被移出；\r\n- 行与行之间可以来自不同请求、不同音色、不同采样参数。\r\n\r\n每一步参与计算的都是尚未结束的句子，短句结束后它的行位立即空出来给新句子。vLLM、TGI 等 LLM 推理服务用的也是连续批处理。\r\n\r\n要做到这一点，必须掌控解码循环本身。原版路径里，从第一个码到最后一个码全部发生在 HF `generate()` 的一次调用里（`gpt/model.py:698`），`generate()` 内部的 for 循环一直执行到停止符，中途无法插入新句子。`Scheduler` 的做法是**把这个循环拆出来，自己拥有它**：\r\n\r\n1. **循环体**。`_decode()`（`batch.py:233`）手写 `generate()` 内部的一轮：嵌入每行上一步采出的 token，一次前向（显式传入 `past_key_values`），每行各自采样下一个 token。\r\n2. **行状态**。KV cache（`self.past`）、注意力掩码（`self.mask`）、每行出现过的 token（`self.seen`）是 `Scheduler` 持有的普通张量，而不是藏在 HF 内部。\r\n3. **循环入口**。`step()`（`batch.py:119`）只走一轮，由 `Engine._serve` 反复调用（第 05 章）；还有没有活要干由 `busy()` 判断。\r\n\r\n拥有循环和状态之后，「加入」和「离开」就只是两种张量操作，都发生在两次前向之间：\r\n\r\n- 加入：新句子单独预填充，得到它的 KV cache，左填充对齐后沿 batch 维 `torch.cat`（`_merge`，`batch.py:186`）；\r\n- 离开：按下标 `index_select` 删掉结束的行，再裁掉所有行都不再使用的左侧填充列（`_keep`，`batch.py:202`）。\r\n\r\n这能成立靠两个前提：行与行在数学上互不影响（增删一行不改变其他行的结果，第 12 章讲过 batch 维的独立性）；每行的位置编码用预先算好的绝对位置，不从 mask 推算，所以左填充不影响位置。\r\n\r\n```fig-loop\r\n```\r\n\r\n## 数据模型\r\n\r\n用户的一次文本提交就是一个 `Job`，这是批处理链的起点。提交先产生任务记录，`Engine.synthesize_many` 在执行时把每个 `(source, text, output, settings)` 包成一个 `Job`（`engine.py:180`）。单句生成、会话的每一条待生成文本、外部 API 的一次调用，都是一个 `Job`。\r\n\r\n`Job` 在 `Scheduler.submit` 时切分（`batch.py:104-117`）：`tokenizer.split_sentences` 按 `max_text_tokens_per_sentence` 切成 S 个 `_Sentence`，按顺序进入 `waiting`。`_Sentence` 是入批单位，行位不够时整个 `_Sentence` 等待，不会被拆开。\r\n\r\n一个 `_Sentence` 入批时做一次预填充，输入是 GPT 层的 `[cond][text][start_mel]`，得到 KV cache 与第一个 token 的 logits。`num_beams` 在这里表示 best-of-N：这份 KV 沿 batch 维展开成 N 份，成为 N 个 `_Row`。它们共享同一段输入，各自采样、各自结束；`_Row` 是解码单位。\r\n\r\n完成逐级向上：`_settle` 发现一个 `_Sentence` 的 N 个 `_Row` 全部结束，调 `_finish`；`_finish` 按平均 log 概率选一个 `_Row`，vocode 后写进 `job.wavs[sentence.index]`，再给 `job.finished` 加一。`job.finished == job.total` 时（`batch.py:326`）`torch.cat` 拼波形、`job.done` 置位。`_Sentence` 可以乱序完成，`sentence.index` 保证拼接顺序。\r\n\r\n| 层级 | 对应 | 数量 | 完成标志 |\r\n|---|---|---|---|\r\n| `Job` | 一次文本提交 | 1 | `job.finished == job.total`，`done` 置位 |\r\n| `_Sentence` | 一段文本、一次预填充 | 1 `Job` : S 个 | 自己的 N 个 `_Row` 全部 finished |\r\n| `_Row` | 一条解码序列 | 1 `_Sentence` : N 个（`best_of`） | stop / `max_mel_tokens` / runaway |\r\n\r\n三个层级只在入批时相遇：`rows` 是全局集合，同时装着不同 `Job`、不同 `_Sentence` 的 `_Row`，`Scheduler` 只按下标管理。\r\n\r\n```fig-states\r\n```\r\n\r\n## 调用链\r\n\r\n从 HTTP 到 `Scheduler` 的路线在第 02、05 章已经走过，这里只列出关键节点：\r\n\r\n```\r\nGeneration.speak / Generation.session（mode == "batch"）\r\n  └─ Tasks.submit(concurrent=True)        新线程，不进串行队列\r\n       └─ Engine.synthesize_many          包 Job，放进 pending，唤醒批处理线程；之后只等待\r\n            ·····································\r\n            webui-batch 线程：Engine._serve\r\n              ├─ _loaded()                确保模型已加载，持共享锁\r\n              ├─ Scheduler.submit(job)    首次使用时构造 Scheduler（engine.py:220）\r\n              └─ 循环 Scheduler.step()    直到 busy() 为假，释放锁\r\n```\r\n\r\n台本整篇生成一次提交多个 `Job`：`run_batch` 把每句的参考音频、文本、输出路径打包成 `items`，一次交给 `synthesize_many`，再用 `saved(index)` 回调逐句入库（`generation.py:80`）。外部 API 每次调用一个 `Job`。\r\n\r\n`Scheduler` 不是线程安全的，只有 `webui-batch` 一个线程调用它的 `submit` 和 `step`。\r\n\r\n## `Scheduler` 持有的状态\r\n\r\n`Scheduler` 的状态：\r\n\r\n- `waiting`：已提交、未入批的 `_Sentence`，FIFO；\r\n- `rows`：运行中的 `_Row`，每个 `_Sentence` 会展开成 `best_of` 个（`num_beams` 在这里表示 best-of-N：同一个 `_Sentence` 采 N 条，取平均 log 概率最高的一条）；\r\n- `past`：每一层 decoder 的 KV cache，形状 `[B, heads, T, dim]`，T 随解码步数增长；\r\n- `mask`：`[B, T]`，0 = 左填充、1 = 真实 token；`seen`：`[B, vocab]` 布尔矩阵，记录每个 `_Row` 出现过的 token，供重复惩罚使用。\r\n\r\n`params` 存每个 `_Row` 的采样参数（repetition penalty、temperature、top_k、top_p、do_sample），`rows` 变化就重建（`batch.py:247`）。\r\n\r\n## 单步 step 的执行过程\r\n\r\n`step()`（`batch.py:119`）的代码，注释里的编号对应下文的「分支」：\r\n\r\n```python\r\n# indextts/batch.py:119\r\ndef step(self):\r\n    self._reap()                                                    # 1 取消的 _Row 出批\r\n    while self.waiting and len(self.rows) + self.waiting[0].job.best_of <= self.max_rows:\r\n        self._admit(self.waiting.pop(0))                            # 2 新 _Sentence 入批\r\n    self._settle()                                                  # 3 清理首个 token 即停的 _Row\r\n    if self.rows:                                                   # 4\r\n        self._decode()\r\n```\r\n\r\n分支 2 是 while 不是 if：一次 `step` 可以连续并入多个 `_Sentence`，只要每个 `_Sentence` 需要的 `best_of` 个 `_Row` 都放得下；队首 `_Sentence` 的 `best_of` 大于剩余行位时，整个 `_Sentence` 拒绝，等下一步。「任意一步都能加进来」指的就是这个检查每轮开头都做，没有固定同步点。\r\n\r\n分支 3 处理一种边界：`_admit` 在预填充之后采了第一个 token，如果采到 stop，这个 `_Row` 还没进过 `_decode` 就被标记 finished（`batch.py:290`），`_settle` 在 `_decode` 之前将其移出。best-of-N 时如果所有 `_Row` 的第一个 token 都是 stop，整个 `_Sentence` 只经过预填充那一次前向，解码 0 步。\r\n\r\n分支 4 是唯一跳过前向的地方：`rows` 为空（全部 `_Row` 已取消或已淘汰）时，这一步只做清理。\r\n\r\n```fig-step-loop\r\n```\r\n\r\n## 新 `_Sentence` 的并入\r\n\r\n新 `_Sentence` 的预填充单独做，不打扰运行中的 `_Row`：\r\n\r\n1. `_admit`（`batch.py:154`）把 `[cond][text][start_mel]` 拼成一条输入，前向一次（不带 past），得到 `past_key_values` 和最后一个位置的 logits；\r\n2. best-of-N 时把这份 KV cache 沿 batch 维 `expand` 成 N 份：N 个候选共享同一次预填充，第一个 token 也由同一份 logits 采样 N 次；\r\n3. `_merge`（`batch.py:186`）把新 `_Row` 并进运行中的批：把 cache 与 mask 沿序列维左填充到两边的最大宽度，再沿 batch 维拼接。\r\n\r\n左填充保证最后一个 token 始终落在每个 `_Row` 的最右端，`last_hidden_state[:, -1]` 对所有 `_Row` 成立。填充出来的 0 位只占位、不参与注意力；每个 `_Row` 的位置是预先算好的绝对位置（预填充用 `arange`，解码用 `len(codes) + 1`），不从 mask 推，左填充不改变任何 `_Row` 的位置。\r\n\r\n合并后的批可以长得不齐：老 `_Row` 已经解码了 T 步、cache 长度 T，新 `_Row` 只有预填充那一段。左填充把 cache 补齐到同宽，mask 中新 `_Row` 的左段为 0，解码照常进行。拼接之后，第一个 token 直接从预填充的 logits 采样（`_admit` 末尾），不必等下一次 `_decode`。\r\n\r\n## `_Row` 的退出与完成\r\n\r\n每个 `_Row` 每步解一个 token，结束只有三种情况（`batch.py:290`）：\r\n\r\n```python\r\nif token == self.stop:\r\n    row.finished = row.stopped = True\r\nelif len(row.codes) >= job.max_mel_tokens:\r\n    row.finished = True\r\n```\r\n\r\n长度上限在 `submit` 时被 clamp 到 `mel_limit`（`batch.py:114`）。第三种是 best-of-N 的 runaway 上限：组内第一个停下的 `_Row` 记下长度 L，其余 `_Row` 最多解码到 1.5L+10（`RUNAWAY`，`batch.py:26`），避免落单的候选无限解码。每个 `_Row` 的步数因此互不相同，短的先退出。\r\n\r\n淘汰与完成分两级：\r\n\r\n1. `_settle`（`batch.py:295`）发现 finished 的 `_Row`，`_keep`（`batch.py:202`）按下标 `index_select`，把它们从 `rows`、KV cache、`mask`、`seen` 里一起删掉，并用 `mask.any(0)` 裁掉无人使用的左侧列，避免零列一直占显存和算力；\r\n2. 某个 `_Sentence` 的全部 best-of `_Row` 都 finished 时，`_finish`（`batch.py:313`）按平均 log 概率选优胜 `_Row`、vocode、`job.finished += 1`；该 `Job` 的 `_Sentence` 全部完成时拼接波形、`job.done` 置位（`batch.py:326`）。\r\n\r\n`Engine._serve` 每轮用 `busy()`（`batch.py:101`，`bool(rows or waiting)`）判断是否继续，两者都空时退出 `_loaded()`，释放共享锁。\r\n\r\n```fig-step-timeline\r\n```\r\n\r\n## 任意进出的前提\r\n\r\n- KV cache 是显式张量，进出批只是 dim 0 的 cat 与 index_select，不依赖静态 shape；\r\n- `_Row` 之间互不影响，增删 `_Row` 不改动其他 `_Row` 的数学结果；\r\n- 采样参数按 `_Row` 挂在 `params` 上，`rows` 变化后自动重建；\r\n- `_condition`（`batch.py:136`）按 (路径, mtime) 缓存 cond_mel 与 latent，同一参考音频只编码一次，LRU 最多 16 份，密集请求不会重复抽 Mel。\r\n\r\n## 取消与失败\r\n\r\n取消在 `Job` 上置 `cancelled`，下一个 `step` 的 `_reap` 调 `_cancel_job`：从 `waiting` 移除它的 `_Sentence`、从 `rows` 删掉它的 `_Row`，再 `job.fail(Cancelled())`（`batch.py:220-229`）。等待 `job.done` 的线程每 0.5 秒报一次进度，`Tasks.progress` 抛 `Cancelled` 后，`Engine.synthesize_many` 把这一批 `Job` 全标成 `cancelled`（`engine.py:203-206`）。其余 `_Row` 照常解码，短的 `_Sentence` 照常先完成。\r\n\r\n失败走同一出口：`_condition`、`_vocode` 里的异常都交给 `_cancel_job`，`job.error` 记下首个错误；等待 `job.done` 的线程发现后原样抛出，任务被标成 `failed`。`Engine._serve` 外层再兜底一次 `fail_all`，把 `Scheduler` 整个清空（`engine.py:234-241`）。\r\n\r\n与 `fast` 的关系：\r\n\r\n| | fast | batch |\r\n|---|---|---|\r\n| 批的边界 | 一个桶 | 持续变化的行集合 |\r\n| 短句等待 | 等桶内最长句 | 立即退出 |\r\n| 候选 | beam search | best-of-N |\r\n| 调度 | 串行 worker | 独立线程 |\r\n\r\n两条路径都只使用 `UnifiedVoice` 的组件，不共享 `IndexTTS` 的 prompt 缓存，所以可以同时存在。\r\n\r\n## 本章对应文件\r\n\r\n- `backend/generation.py:29` — 选择推理路径并封任务闭包\r\n- `backend/tasks.py:61` — `concurrent` 任务另起线程\r\n- `backend/engine.py:171`、`:208` — `synthesize_many`、`_serve`\r\n- `indextts/batch.py:34`、`:80` — `Job`、`Scheduler`\r\n- `indextts/batch.py:104` — 提交后只入 `waiting`\r\n- `indextts/batch.py:119` — 连续批处理的 `step`\r\n- `indextts/batch.py:154` — 单句预填充\r\n- `indextts/batch.py:186` — 左填充后并入运行中的批\r\n- `indextts/batch.py:202` — 行的退出与左侧列裁剪\r\n- `indextts/batch.py:220` — 取消后的剔除\r\n- `indextts/batch.py:233` — `_decode`，所有 `_Row` 各前向一次\r\n- `indextts/batch.py:260` — 逐行采样\r\n- `indextts/batch.py:295` — runaway 限制与 `_Sentence` 的完成\r\n- `indextts/gpt/model.py:698` — 原版路径调 HF `generate()`，用于对照\r\n',reference:"## infer 与 infer_fast 的参数\r\n\r\n两个函数的签名：\r\n\r\n```python\r\n# indextts/infer.py:500\r\ndef infer(self, audio_prompt, text, output_path, verbose=False,\r\n          max_text_tokens_per_sentence=120, **generation_kwargs)\r\n\r\n# indextts/infer.py:278\r\ndef infer_fast(self, audio_prompt, text, output_path, verbose=False,\r\n               max_text_tokens_per_sentence=100, sentences_bucket_max_size=4,\r\n               **generation_kwargs)\r\n```\r\n\r\n固定参数：\r\n\r\n| 参数 | 默认 | 说明 |\r\n|---|---|---|\r\n| `audio_prompt` | — | 参考音频路径 |\r\n| `text` | — | 原文 |\r\n| `output_path` | — | 输出 WAV；为空时返回数组 |\r\n| `verbose` | `False` | 打印中间张量 |\r\n| `max_text_tokens_per_sentence` | 120 / 100 | 单句 token 上限 |\r\n| `sentences_bucket_max_size` | 4，仅 fast | 每桶最多几句 |\r\n\r\n`**generation_kwargs` 两函数都会取出这些，剩下的继续传给 HF `generate`：\r\n\r\n| 参数 | 默认 | 作用 |\r\n|---|---|---|\r\n| `do_sample` | `True` | 采样或贪心 |\r\n| `top_p` | 0.8 | 核采样 |\r\n| `top_k` | 30 | 截断到前 k 个 |\r\n| `temperature` | 1.0 | 温度 |\r\n| `num_beams` | 3 | beam 数；batch 模式下是 best-of-N |\r\n| `length_penalty` | 0.0 | beam 长度惩罚 |\r\n| `repetition_penalty` | 10.0 | 重复惩罚 |\r\n| `max_mel_tokens` | 600 | 单句最大码数 |\r\n\r\n写死为 1 的内部参数：\r\n\r\n```python\r\nautoregressive_batch_size = 1   # 即 num_return_sequences\r\n```\r\n\r\n两者的实质差异：\r\n\r\n| | infer | infer_fast |\r\n|---|---|---|\r\n| 分句上限 | 120 | 100 |\r\n| 分桶 | 无 | 有，默认 4 |\r\n| 生成 | 逐句 | 每桶一次 batch |\r\n| BigVGAN | 逐句 | 每 2 句拼一次 |\r\n| 输出顺序 | 自然顺序 | 生成后按 idx 重排 |\r\n\r
